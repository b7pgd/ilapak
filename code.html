<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Formatter Cleaner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0f172a;
    color:#e2e8f0;
    font-family:Segoe UI,Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:1600px;
    margin:auto;
}

h1{
    margin-bottom:15px;
}

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.clean{
    background:#2563eb;
    color:white;
}

.copy{
    background:#16a34a;
    color:white;
}

.clear{
    background:#dc2626;
    color:white;
}

.stats{
    margin-left:auto;
    display:flex;
    align-items:center;
    color:#94a3b8;
    font-size:14px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

textarea{
    width:100%;
    height:80vh;
    resize:none;
    border:none;
    outline:none;
    padding:16px;
    border-radius:12px;
    background:#1e293b;
    color:#f8fafc;
    font-family:Consolas,monospace;
    font-size:14px;
    line-height:1.5;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>Text Formatter Cleaner</h1>

<div class="toolbar">

<button class="clean" onclick="cleanText()">
Clean Text
</button>

<button class="copy" onclick="copyOutput()">
Copy Result
</button>

<button class="clear" onclick="clearAll()">
Clear
</button>

<div class="stats">
<span id="stats">0 chars | 0 lines</span>
</div>

</div>

<div class="grid">

<textarea
id="input"
placeholder="Paste huge text here..."
oninput="updateStats()"
></textarea>

<textarea
id="output"
placeholder="Formatted result..."
readonly
></textarea>

</div>

</div>

<script>

function cleanText(){

    let text =
        document.getElementById("input").value;

    text = text.replace(/\r\n/g,"\n");

    text = text.replace(/\t/g,"    ");

    text = text.split("\n")
        .map(line => line.replace(/\s+$/g,""))
        .join("\n");

    text = text.replace(/\n{3,}/g,"\n\n");

    document.getElementById("output").value =
        text;

    updateStats();
}

async function copyOutput(){

    const text =
        document.getElementById("output").value;

    if(!text){
        return;
    }

    await navigator.clipboard.writeText(text);
}

function clearAll(){

    document.getElementById("input").value="";
    document.getElementById("output").value="";
    updateStats();
}

function updateStats(){

    const txt =
        document.getElementById("input").value;

    const chars = txt.length;

    const lines =
        txt === ""
        ? 0
        : txt.split("\n").length;

    document.getElementById("stats").textContent =
        chars + " chars | " +
        lines + " lines";
}

</script>

</body>
</html>
