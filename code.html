<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Formatter Cleaner</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#f0f4f8;
    color:#1e293b;
    font-family:Segoe UI,Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:1600px;
    margin:auto;
}

h1{
    margin-bottom:15px;
    color:#1d4ed8;
}

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

/* Container khusus kolom tombol kiri */
.action-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    transition: background 0.2s;
}

.clean{
    background:#1a73e8;
    color:white;
}
.clean:hover{ background:#1557b0; }

.paste-btn{
    background:#0b8457;
    color:white;
}
.paste-btn:hover{ background:#096b46; }

.copy{
    background:#2563eb;
    color:white;
}
.copy:hover{ background:#1d4ed8; }

.clear{
    background:#dc2626;
    color:white;
}
.clear:hover{ background:#b91c1c; }

.stats{
    margin-left:auto;
    display:flex;
    align-items:center;
    color:#64748b;
    font-size:14px;
    font-weight: 600;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

textarea{
    width:100%;
    height:80vh;
    resize:none;
    border:1px solid #cbd5e1;
    outline:none;
    padding:16px;
    border-radius:12px;
    background:#ffffff;
    color:#0f172a;
    font-family:Consolas,monospace;
    font-size:14px;
    line-height:1.5;
}

textarea:focus{
    border-color:#2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

textarea[readonly]{
    background:#f8fafc;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
    /* Di mobile, susunan tombol group sejajar ke samping */
    .action-group {
        flex-direction: row;
        gap: 10px;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>Text Formatter Cleaner</h1>

<div class="toolbar">

<button class="clean" onclick="pasteAndClean()">
Paste & Clean Text
</button>

<button class="copy" onclick="copyOutput()">
Copy Result
</button>

<button class="clear" onclick="clearAll()">
Clear
</button>

<div class="stats">
<span id="stats">0 chars | 0 lines</span>
</div>

</div>

<div class="grid">

<textarea
id="input"
placeholder="Paste huge text here..."
oninput="updateStats()"
></textarea>

<textarea
id="output"
placeholder="Formatted result..."
readonly
></textarea>

</div>

</div>

<script>

function cleanText(){

    let text =
        document.getElementById("input").value;

    text = text.replace(/\r\n/g,"\n");

    text = text.replace(/\t/g,"    ");

    text = text.split("\n")
        .map(line => line.replace(/\s+$/g,""))
        .join("\n");

    text = text.replace(/\n{3,}/g,"\n\n");

    document.getElementById("output").value =
        text;

    updateStats();
}

async function pasteInput(){
    if(navigator.clipboard && window.isSecureContext){
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById("input").value = text;
            updateStats();
        } catch (err) {
            alert('Gagal membaca clipboard. Izinkan akses clipboard browser.');
        }
    } else {
        alert('Fitur paste otomatis membutuhkan koneksi aman (HTTPS).');
    }
}

async function pasteAndClean(){
    if(navigator.clipboard && window.isSecureContext){
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById("input").value = text;
            cleanText();
        } catch (err) {
            alert('Gagal membaca clipboard. Izinkan akses clipboard browser.');
        }
    } else {
        alert('Fitur paste otomatis membutuhkan koneksi aman (HTTPS).');
    }
}

async function copyOutput(){

    const text =
        document.getElementById("output").value;

    if(!text){
        return;
    }

    await navigator.clipboard.writeText(text);
}

function clearAll(){

    document.getElementById("input").value="";
    document.getElementById("output").value="";
    updateStats();
}

function updateStats(){

    const txt =
        document.getElementById("input").value;

    const chars = txt.length;

    const lines =
        txt === ""
        ? 0
        : txt.split("\n").length;

    document.getElementById("stats").textContent =
        chars + " chars | " +
        lines + " lines";
}

</script>

</body>
</html>
