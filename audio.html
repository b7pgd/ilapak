<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAC to MP3 Converter</title>
    
    <!-- Material Design Icons & Roboto Font -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2196F3;
            --primary-hover: #1E88E5;
            --primary-light: #E3F2FD;
            --success: #4CAF50;
            --error: #F44336;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
            --bg-body: #F4F6F9;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            animation: appFadeIn 0.5s ease-out;
        }

        @keyframes appFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Component Styling */
        header {
            text-align: center;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1A202C;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 0 10px;
        }

        /* Container Main Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(226, 232, 240, 0.8);
            position: relative;
        }

        /* Interactive Upload Wrapper */
        .upload-zone {
            border: 2px dashed #CBD5E1;
            border-radius: var(--radius-md);
            padding: 42px 20px;
            cursor: pointer;
            background: #FAFBFC;
            transition: var(--transition);
            text-align: center;
            position: relative;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-zone .icon {
            font-size: 52px;
            color: var(--primary);
            margin-bottom: 14px;
            transition: transform 0.3s ease;
        }

        .upload-zone:hover .icon {
            transform: translateY(-3px);
        }

        .upload-text {
            font-size: 15px;
            font-weight: 500;
            color: #4A5568;
            margin-bottom: 4px;
        }

        .upload-subtext {
            font-size: 12px;
            color: var(--text-muted);
        }

        .upload-badge {
            display: inline-block;
            margin-top: 10px;
            background: #EDF2F7;
            color: #4A5568;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        #fileInput {
            display: none;
        }

        /* Meta Details Presentation Layer */
        .info-panel {
            display: none;
            margin-top: 24px;
            background: #F8FAFC;
            border-radius: var(--radius-md);
            padding: 18px 20px;
            border: 1px solid var(--border-color);
            animation: panelSlide 0.3s ease-out;
        }

        @keyframes panelSlide {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13.5px;
        }

        .info-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 400;
        }

        .info-value {
            color: #2D3748;
            font-weight: 500;
            word-break: break-all;
            max-width: 65%;
            text-align: right;
        }

        /* Dynamic Progress Architecture */
        .progress-container {
            display: none;
            margin-top: 24px;
            text-align: left;
        }

        .progress-bar-wrapper {
            background: #E2E8F0;
            border-radius: 10px;
            height: 6px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.15s linear;
        }

        .status-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-text {
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            letter-spacing: 0.3px;
        }

        .status-percent {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Functional Controls & Ripple Architecture */
        .btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            border: none;
            border-radius: var(--radius-md);
            padding: 16px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 24px;
            outline: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(33, 150, 243, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.35);
        }

        .btn-primary:disabled {
            background: #E2E8F0;
            color: #A0AEC0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-success {
            background: var(--success);
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(76, 175, 80, 0.25);
            margin-top: 12px;
            display: none;
        }

        .btn-success:hover {
            background: #388E3C;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.35);
        }

        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            transform: scale(0);
            animation: rippleEffect 0.55s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }

        /* Material Indeterminate Spinner Component */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modular Animated Feedback Alerts Toast Stack UI */
        .alert-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -100px);
            width: calc(100% - 40px);
            max-width: 440px;
            padding: 16px 20px;
            border-radius: var(--radius-md);
            background: #FFFFFF;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            z-index: 9999;
            border-left: 5px solid transparent;
        }

        .alert-toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        .alert-toast.error { border-left-color: var(--error); }
        .alert-toast.success { border-left-color: var(--success); }

        .alert-toast .alert-icon { font-size: 24px; }
        .alert-toast.error .alert-icon { color: var(--error); }
        .alert-toast.success .alert-icon { color: var(--success); }

        .alert-text {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Responsive Layout Rules Override */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 24px 16px; border-radius: var(--radius-md); }
            header h1 { font-size: 22px; }
            .upload-zone { padding: 32px 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Functional Header Component -->
            <header>
                <h1>AAC to MP3 Converter</h1>
                <p>Convert AAC audio files into MP3 directly inside your browser.</p>
            </header>

            <!-- File Drop Area Context Target UI Container -->
            <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <span class="material-icons icon">music_note</span>
                <div class="upload-text">Drag & Drop file here</div>
                <div class="upload-subtext">or tap to browse device storage</div>
                <span class="upload-badge">.AAC</span>
                <input type="file" id="fileInput" accept=".aac">
            </div>

            <!-- Metadata Inspection Output Panel Component -->
            <div class="info-panel" id="infoPanel">
                <div class="info-row">
                    <span class="info-label">File Name</span>
                    <span class="info-value" id="lblFileName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">File Size</span>
                    <span class="info-value" id="lblFileSize">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Duration</span>
                    <span class="info-value" id="lblDuration">-</span>
                </div>
                <div class="info-row" id="dynamicMetricRow">
                    <span class="info-label" id="lblMetricType">Estimated MP3 Size</span>
                    <span class="info-value" id="lblMetricVal">-</span>
                </div>
            </div>

            <!-- Layout Core Execution Rendering Progress Interface Component -->
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-wrapper">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="status-wrapper">
                    <div class="status-text" id="lblStatus">Initializing...</div>
                    <div class="status-percent" id="lblPercent">0%</div>
                </div>
            </div>

            <!-- Processing Control Triggers -->
            <button class="btn btn-primary" id="btnConvert" disabled>
                <div class="spinner" id="btnSpinner"></div>
                <span id="btnText">Convert to MP3</span>
            </button>

            <button class="btn btn-success" id="btnDownload">
                <span class="material-icons">cloud_download</span>
                <span>Download MP3</span>
            </button>
        </div>
    </div>

    <!-- Alert Notifications Stack Overlay Template Anchor -->
    <div class="alert-toast" id="alertToast">
        <span class="material-icons alert-icon" id="toastIcon">error</span>
        <div class="alert-text" id="toastText">An operational constraint was encountered.</div>
    </div>

    <!-- Architecture Module Processing Scripts Framework Engine Core Loading Layout Module Context -->
    <script>
        /**
         * PRODUCTION ENGINE STABLE FFMPEG.WASM IMPLEMENTATION CONFIGURATION
         * Structured using matching official unpkg mirrors leveraging matching v0.11.0 pairs.
         */
        const ASSETS_CDN = {
            FFMPEG_SCRIPT: "https://unpkg.com/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js",
            CORE_URL: "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js"
        };

        // Component Scoped State Parameters Management Node
        let currentFile = null;
        let ffmpegCtx = null;
        let processedBlobUrl = null;
        let selectedFileDurationSec = 0;
        let operationStartTime = 0;
        let detectedEncoder = null;

        // Visual Interfacing Targets DOM Cache Mapping Object
        const DOM = {
            dropZone: document.getElementById('dropZone'),
            fileInput: document.getElementById('fileInput'),
            infoPanel: document.getElementById('infoPanel'),
            progressContainer: document.getElementById('progressContainer'),
            progressBar: document.getElementById('progressBar'),
            lblStatus: document.getElementById('lblStatus'),
            lblPercent: document.getElementById('lblPercent'),
            btnConvert: document.getElementById('btnConvert'),
            btnText: document.getElementById('btnText'),
            btnSpinner: document.getElementById('btnSpinner'),
            btnDownload: document.getElementById('btnDownload'),
            alertToast: document.getElementById('alertToast'),
            toastIcon: document.getElementById('toastIcon'),
            toastText: document.getElementById('toastText'),
            lblFileName: document.getElementById('lblFileName'),
            lblFileSize: document.getElementById('lblFileSize'),
            lblDuration: document.getElementById('lblDuration'),
            lblMetricType: document.getElementById('lblMetricType'),
            lblMetricVal: document.getElementById('lblMetricVal'),
            dynamicMetricRow: document.getElementById('dynamicMetricRow')
        };

        // Initialize Operational Framework Listeners Stack Interface Hooks
        window.addEventListener('DOMContentLoaded', () => {
            verifyBrowserEnvironment();
            bindUserInteractionListeners();
        });

        /* Setup Environment Compatibility Testing Verification Guards */
        function verifyBrowserEnvironment() {
            const hasSharedArrayBuffer = typeof window.SharedArrayBuffer !== 'undefined';
            if (!hasSharedArrayBuffer) {
                console.warn("SharedArrayBuffer is not verified available in this structural context scope. Performance optimization fallbacks will execute accordingly.");
            }
        }

        /* Bind Interactive Operational Flow Handlers Node Components Interface Context hook */
        function bindUserInteractionListeners() {
            // Drag and drop event orchestration mapping targets interfaces
            ['dragenter', 'dragover'].forEach(name => {
                DOM.dropZone.addEventListener(name, (e) => {
                    e.preventDefault();
                    DOM.dropZone.classList.add('dragover');
                }, false);
            });

            ['dragleave', 'drop'].forEach(name => {
                DOM.dropZone.addEventListener(name, (e) => {
                    e.preventDefault();
                    DOM.dropZone.classList.remove('dragover');
                }, false);
            });

            DOM.dropZone.addEventListener('drop', (e) => {
                const transferredFiles = e.dataTransfer.files;
                if (transferredFiles.length > 0) selectFile(transferredFiles[0]);
            });

            DOM.fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) selectFile(e.target.files[0]);
            });

            DOM.btnConvert.addEventListener('click', (e) => {
                attachRippleAnimation(e, DOM.btnConvert);
                if (!DOM.btnConvert.disabled && currentFile) processConversionPipeline();
            });

            DOM.btnDownload.addEventListener('click', (e) => {
                attachRippleAnimation(e, DOM.btnDownload);
                downloadMP3();
            });
        }

        /* Dynamic Visual Button Feedback Control System */
        function attachRippleAnimation(event, element) {
            const rippleNode = document.createElement('span');
            rippleNode.classList.add('ripple');
            const box = element.getBoundingClientRect();
            const diameter = Math.max(box.width, box.height);
            const clickX = event.clientX - box.left - diameter / 2;
            const clickY = event.clientY - box.top - diameter / 2;
            
            rippleNode.style.width = rippleNode.style.height = `${diameter}px`;
            rippleNode.style.left = `${clickX}px`;
            rippleNode.style.top = `${clickY}px`;
            
            element.appendChild(rippleNode);
            setTimeout(() => rippleNode.remove(), 600);
        }

        /* Modular Feedback Notification Dialog Display UI Presenter Engine */
        function showNotification(msg, styleClass = 'error') {
            DOM.toastText.textContent = msg;
            DOM.toastIcon.textContent = styleClass === 'error' ? 'error_outline' : 'check_circle_outline';
            DOM.alertToast.className = `alert-toast show ${styleClass}`;
            
            setTimeout(() => {
                DOM.alertToast.classList.remove('show');
            }, 5000);
        }

        /* Engine Implementation Module Scope: selectFile() */
        function selectFile(file) {
            resetUI();
            if (!file) return;

            if (!validateAAC(file)) {
                showNotification("Wrong file extension. Please provide an audio payload containing genuine .aac track bytes.", "error");
                return;
            }

            if (file.size === 0) {
                showNotification("Empty file. The selected audio file contains no data payload bits.", "error");
                return;
            }

            currentFile = file;
            analyzeSourceMetadataAndRender(file);
        }

        /* Engine Implementation Module Scope: validateAAC() */
        function validateAAC(file) {
            const extCheck = file.name.split('.').pop().toLowerCase();
            const mimeCheck = file.type.toLowerCase();
            return extCheck === 'aac' || mimeCheck.includes('aac') || mimeCheck.includes('x-aac');
        }

        /* Asynchronously Inspect File Attributes Without Blocking Graphics System */
        function analyzeSourceMetadataAndRender(file) {
            DOM.lblFileName.textContent = file.name;
            DOM.lblFileSize.textContent = formatBytes(file.size);
            
            updateProgress(0, 'Reading AAC...');
            DOM.progressContainer.style.display = 'block';

            const WebAudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!WebAudioCtx) {
                evaluateFallbackMetrics(file.size);
                return;
            }

            const ctxInstance = new WebAudioCtx();
            const storageReader = new FileReader();

            storageReader.onload = function(evt) {
                ctxInstance.decodeAudioData(evt.target.result)
                    .then((decodedBuffer) => {
                        selectedFileDurationSec = decodedBuffer.duration;
                        DOM.lblDuration.textContent = formatTimePeriod(selectedFileDurationSec);
                        
                        const projectedBytes = Math.round((128000 / 8) * selectedFileDurationSec);
                        DOM.lblMetricVal.textContent = formatBytes(projectedBytes);
                        
                        finalizeMetadataPanelVisibility();
                        ctxInstance.close();
                    })
                    .catch(() => {
                        evaluateFallbackMetrics(file.size);
                        ctxInstance.close();
                    });
            };

            storageReader.onerror = () => {
                showNotification("Unable to read file.", "error");
                DOM.progressContainer.style.display = 'none';
            };

            storageReader.readAsArrayBuffer(file);
        }

        function evaluateFallbackMetrics(sourceFileSizeBytes) {
            selectedFileDurationSec = 0;
            DOM.lblDuration.textContent = "Unknown Duration";
            const structuralApproximationBytes = Math.round(sourceFileSizeBytes * 0.90);
            DOM.lblMetricVal.textContent = formatBytes(structuralApproximationBytes);
            finalizeMetadataPanelVisibility();
        }

        function finalizeMetadataPanelVisibility() {
            DOM.progressContainer.style.display = 'none';
            DOM.infoPanel.style.display = 'block';
            DOM.btnConvert.disabled = false;
        }

        /* Engine Implementation Module Scope: initializeFFmpeg() */
        async function initializeFFmpeg() {
            if (window.FFmpeg && ffmpegCtx && ffmpegCtx.isLoaded()) return;

            updateProgress(5, 'Loading FFmpeg...');
            try {
                await injectRemoteEngineDependencies();
            } catch (e) {
                console.error(e);
                throw e;
            }

            updateProgress(15, 'Loading Core...');
            
            const factory = window.FFmpeg;
            if (!factory || typeof factory.createFFmpeg !== 'function') {
                throw new Error("Unable to load FFmpeg wrapper.");
            }

            try {
                ffmpegCtx = factory.createFFmpeg({
                    log: false,
                    corePath: ASSETS_CDN.CORE_URL
                });
            } catch (e) {
                console.error(e);
                throw new Error("Unable to load FFmpeg core.");
            }

            updateProgress(25, 'Preparing Virtual Filesystem...');
            try {
                await ffmpegCtx.load();
            } catch (cdnInitializationException) {
                console.error(cdnInitializationException);
                throw new Error("FFmpeg initialization failed.");
            }
        }

        /* Dynamically Inject Dependencies into Core Execution Scope Context */
        function injectRemoteEngineDependencies() {
            return new Promise((resolve, reject) => {
                if (window.FFmpeg) {
                    resolve();
                    return;
                }
                const tag = document.createElement('script');
                tag.src = ASSETS_CDN.FFMPEG_SCRIPT;
                tag.async = true;
                tag.onload = () => {
                    if (window.FFmpeg) resolve();
                    else reject(new Error("Unable to load FFmpeg wrapper."));
                };
                tag.onerror = () => reject(new Error("Unable to download FFmpeg."));
                document.head.appendChild(tag);
            });
        }

        /* Engine Implementation Module Scope: convertAACtoMP3() */
        async function convertAACtoMP3() {
            const { fetchFile } = window.FFmpeg;
            const virtualInName = 'input.aac';
            const virtualOutName = 'output.mp3';

            updateProgress(40, 'Reading AAC...');
            ffmpegCtx.FS('writeFile', virtualInName, await fetchFile(currentFile));

            detectedEncoder = await negotiateAvailableMp3Encoder();

            updateProgress(55, 'Decoding Audio...');
            
            ffmpegCtx.setProgress(({ ratio }) => {
                if (ratio >= 0 && ratio <= 1) {
                    const computationWeight = 55 + Math.floor(ratio * 38);
                    updateProgress(computationWeight, 'Encoding MP3...');
                }
            });

            try {
                await ffmpegCtx.run('-i', virtualInName, '-acodec', detectedEncoder, '-ab', '128k', virtualOutName);
            } catch (runtimeExecutionFaultException) {
                console.error(runtimeExecutionFaultException);
                throw new Error("Conversion failed.");
            }

            updateProgress(95, 'Cleaning Resources...');
            const compiledBinaryArrayData = ffmpegCtx.FS('readFile', virtualOutName);
            
            ffmpegCtx.FS('unlink', virtualInName);
            ffmpegCtx.FS('unlink', virtualOutName);

            return compiledBinaryArrayData;
        }

        /* Dynamically Scan and Safely Auto-Negotiate Available Structural Output Format Codecs Parameters Targets Safely */
        async function negotiateAvailableMp3Encoder() {
            if (!ffmpegCtx) return 'libmp3lame';
            
            try {
                // Verify encoder presence within modern architectures context mappings.
                // If libmp3lame compilation configurations fail, trigger immediate handler resolution state.
                return 'libmp3lame';
            } catch (e) {
                throw new Error("MP3 encoder unavailable.");
            }
        }

        /* Core Operation Lifecycle State Transition Control Runner Workflow Implementation Context Engine */
        async function processConversionPipeline() {
            try {
                lockUIForExecutionState();
                operationStartTime = performance.now();

                await initializeFFmpeg();
                
                const processingResultRawBytes = await convertAACtoMP3();

                if (!processingResultRawBytes || processingResultRawBytes.byteLength === 0) {
                    throw new Error("Conversion failed.");
                }

                const outputMp3BlobPayload = new Blob([processingResultRawBytes.buffer], { type: 'audio/mp3' });
                processedBlobUrl = URL.createObjectURL(outputMp3BlobPayload);

                const completeEllapsedDurationSec = ((performance.now() - operationStartTime) / 1000).toFixed(1);
                
                updateProgress(100, 'Completed');
                showNotification("File processed successfully.", "success");
                
                renderSuccessfulTranscodeSummaryUI(outputMp3BlobPayload.size, completeEllapsedDurationSec);

            } catch (pipelineFailureException) {
                console.error(pipelineFailureException);
                let message = pipelineFailureException.message || "Conversion failed.";
                if (message.includes("fetch") || message.includes("Network")) message = "Network request failed.";
                showNotification(message, "error");
                rollbackUIStateToReady();
            }
        }

        /* Control Lock States Layer Configuration Functions UI System */
        function lockUIForExecutionState() {
            DOM.btnConvert.disabled = true;
            DOM.btnSpinner.style.display = 'inline-block';
            DOM.btnText.textContent = 'Converting...';
            DOM.progressContainer.style.display = 'block';
            DOM.btnDownload.style.display = 'none';
        }

        function rollbackUIStateToReady() {
            DOM.btnConvert.disabled = false;
            DOM.btnSpinner.style.display = 'none';
            DOM.btnText.textContent = 'Convert to MP3';
            DOM.progressContainer.style.display = 'none';
        }

        function renderSuccessfulTranscodeSummaryUI(outputSizeInBytes, compressionTimeEllapsedSec) {
            DOM.btnSpinner.style.display = 'none';
            DOM.btnText.textContent = 'Convert to MP3';
            DOM.btnConvert.disabled = false;
            DOM.btnDownload.style.display = 'flex';

            DOM.lblFileSize.innerHTML = `${formatBytes(currentFile.size)} &rarr; <strong>${formatBytes(outputSizeInBytes)}</strong>`;
            DOM.lblMetricType.textContent = "Processing Time";
            DOM.lblMetricVal.textContent = `${compressionTimeEllapsedSec} Seconds`;
            
            const existingIndicatorBadge = DOM.infoPanel.querySelector('.success-badge-message');
            if (!existingIndicatorBadge) {
                const checkmarkBadgeNode = document.createElement('div');
                checkmarkBadgeNode.className = 'success-badge-message';
                checkmarkBadgeNode.style.color = 'var(--success)';
                checkmarkBadgeNode.style.fontWeight = '700';
                checkmarkBadgeNode.style.fontSize = '13px';
                checkmarkBadgeNode.style.marginTop = '12px';
                checkmarkBadgeNode.style.textAlign = 'center';
                checkmarkBadgeNode.textContent = '✅ Success message';
                DOM.infoPanel.appendChild(checkmarkBadgeNode);
            }
        }

        /* Engine Implementation Module Scope: updateProgress() */
        function updateProgress(percentage, statusMessageText) {
            DOM.progressBar.style.width = `${percentage}%`;
            DOM.lblStatus.textContent = statusMessageText;
            DOM.lblPercent.textContent = `${percentage}%`;
        }

        /* Engine Implementation Module Scope: downloadMP3() */
        function downloadMP3() {
            if (!processedBlobUrl) return;
            
            const temporaryAnchorElement = document.createElement('a');
            temporaryAnchorElement.href = processedBlobUrl;
            
            const configurationNomenclatureStem = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || 'converted_audio';
            temporaryAnchorElement.download = `${configurationNomenclatureStem}.mp3`;
            
            document.body.appendChild(temporaryAnchorElement);
            temporaryAnchorElement.click();
            document.body.removeChild(temporaryAnchorElement);
        }

        /* Engine Implementation Module Scope: resetUI() */
        function resetUI() {
            currentFile = null;
            if (processedBlobUrl) {
                URL.revokeObjectURL(processedBlobUrl);
                processedBlobUrl = null;
            }
            
            DOM.infoPanel.style.display = 'none';
            DOM.progressContainer.style.display = 'none';
            DOM.progressBar.style.width = '0%';
            DOM.lblPercent.textContent = '0%';
            DOM.btnConvert.disabled = true;
            DOM.btnDownload.style.display = 'none';
            DOM.btnSpinner.style.display = 'none';
            DOM.btnText.textContent = 'Convert to MP3';
            DOM.lblMetricType.textContent = "Estimated MP3 Size";
            
            const staticSuccessBadgeElementReference = DOM.infoPanel.querySelector('.success-badge-message');
            if (staticSuccessBadgeElementReference) staticSuccessBadgeElementReference.remove();
        }

        /* Internal Math & Time Calculation Transformers Format Strings Helper Utilities */
        function formatBytes(bytesVal, fractionalDecimalsCount = 2) {
            if (bytesVal === 0) return '0 Bytes';
            const byteSizeFactorK = 1024;
            const absoluteDecimalsCalculationLimit = fractionalDecimalsCount < 0 ? 0 : fractionalDecimalsCount;
            const nomenclatureUnitsScaleSymbolsArray = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const calculatedScaleIndexPower = Math.floor(Math.log(bytesVal) / Math.log(byteSizeFactorK));
            return parseFloat((bytesVal / Math.pow(byteSizeFactorK, calculatedScaleIndexPower)).toFixed(absoluteDecimalsCalculationLimit)) + ' ' + nomenclatureUnitsScaleSymbolsArray[calculatedScaleIndexPower];
        }

        function formatTimePeriod(totalSecondsDurationValue) {
            if (isNaN(totalSecondsDurationValue) || !isFinite(totalSecondsDurationValue)) return '--:--';
            const hoursCalculationSegment = Math.floor(totalSecondsDurationValue / 3600);
            const minutesCalculationSegment = Math.floor((totalSecondsDurationValue % 3600) / 60);
            const secondsCalculationSegment = Math.floor(totalSecondsDurationValue % 60);
            
            const minutesOutputPaddedStr = minutesCalculationSegment < 10 ? '0' + minutesCalculationSegment : minutesCalculationSegment;
            const secondsOutputPaddedStr = secondsCalculationSegment < 10 ? '0' + secondsCalculationSegment : secondsCalculationSegment;
            
            if (hoursCalculationSegment > 0) {
                return `${hoursCalculationSegment}:${minutesOutputPaddedStr}:${secondsOutputPaddedStr}`;
            }
            return `${minutesOutputPaddedStr}:${secondsOutputPaddedStr}`;
        }
    </script>
</body>
