<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pencapaian Harian (GitHub Pages)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 20px;
        }

        .app-container {
            max-width: 100%;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-size: 20px;
            color: #0f172a;
        }
        
        .header-title p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        .header-action {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* Filter Style */
        .filter-card {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            margin-bottom: 20px;
        }

        .filter-form {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-size: 14px;
            font-weight: 500;
            color: #475569;
        }

        .filter-group select {
            padding: 6px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            background-color: #f8fafc;
            cursor: pointer;
        }

        /* Table Style */
        .table-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .card-header h2 {
            font-size: 16px;
            color: #1e293b;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 72vh;
        }

        .styled-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        .styled-table th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 600;
            padding: 10px 16px;
            border-bottom: 1px solid #e2e8f0;
            border-right: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Header tanggal di baris atas sticky */
        .styled-table tr:first-child th {
            top: 0;
            z-index: 12;
            background-color: #1e3a8a;
            color: white;
            font-size: 13px;
        }

        /* TH Nama Mesin - Pojok Kiri Atas Cross-Sticky */
        .styled-table th.sticky-corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 30; /* Paling tinggi agar tidak tertimpa baris tanggal/shift */
            background-color: #cbd5e1;
            border-right: 2px solid #94a3b8;
            color: #0f172a;
        }

        /* Header sub-kolom di baris bawah sticky */
        .styled-table tr:nth-child(2) th {
            top: 38px;
            z-index: 11;
            background-color: #f1f5f9;
            color: #475569;
            font-size: 12px;
            border-bottom: 2px solid #cbd5e1;
        }

        .styled-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            border-right: 1px solid #f1f5f9;
            color: #334155;
            vertical-align: middle;
        }

        /* Mengamankan efek sticky kolom nama mesin pada tbody td pertama secara global */
        .styled-table tbody tr td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 5;
            background-color: #ffffff !important; /* Wajib solid agar data horizontal tertutup saat digeser */
            border-right: 2px solid #cbd5e1 !important;
            font-weight: 600;
            color: #1e3a8a;
        }

        .styled-table tbody tr:hover {
            background-color: #f8fafc;
        }
        
        /* Highlight Hover untuk baris yang dikunci kiri */
        .styled-table tbody tr:hover td.sticky-col {
            background-color: #f1f5f9 !important;
        }

        .val-total {
            font-weight: 700;
            color: #0f172a;
            text-align: right;
        }

        .val-capaian {
            font-weight: 700;
            color: #2563eb;
            text-align: right;
        }

        .bg-empty {
            background-color: #fafafa;
            color: #cbd5e1 !important;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="dashboard-header">
            <div class="header-title">
                <h1>📈 Rekap Total Pencapaian Produksi Harian</h1>
                <p>Output Gabungan Shift 1-3 & Akumulasi Efisiensi (Total Output / 31250)</p>
            </div>
            <div class="header-action">
                <a href="#" class="btn-secondary">⬅️ Kembali ke Dashboard</a>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="filter-card">
                <form class="filter-form" onsubmit="event.preventDefault();">
                    <div class="filter-group">
                        <label for="filter-bulan">Filter Bulan:</label>
                        <select id="filter-bulan" name="bulan" onchange="this.form.dispatchEvent(new Event('submit'))">
                            <option value="all">-- Semua Bulan --</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-mesin">Filter Mesin:</label>
                        <select id="filter-mesin" name="mesin" onchange="this.form.dispatchEvent(new Event('submit'))">
                            <option value="all">-- Semua Mesin --</option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="table-card">
                <div class="card-header">
                    <h2>📋 Ringkasan Akumulasi Per Tanggal Kerja</h2>
                </div>
                <div class="table-responsive">
                    <table class="styled-table">
                        <thead>
                            </thead>
                        <tbody>
                            <tr>
                                <td colspan="100" style="text-align:center; padding: 40px; color: #64748b;">
                                    Memuat data pencapaian dari Google Sheets...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
