<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilapak</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-bottom: 32px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu a {
      text-decoration: none;
      background: #ffffff;
      color: #203a43;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: relative;
    }

    .menu a:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.35);
    }

    /* Styling khusus untuk menu baru agar notice-able */
    .menu a.new-item {
      border: 2px solid #00f2fe;
      animation: pulse-glow 2s infinite;
    }

    /* Badge tulisan BARU */
    .badge-new {
      background: #ff4757;
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 2px 5px rgba(255, 71, 87, 0.4);
      animation: bounce 1.5s infinite;
    }

    /* Efek pendaran cahaya (glow) */
    @keyframes pulse-glow {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.6);
      }
      70% {
        box-shadow: 0 0 0 12px rgba(0, 242, 254, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 242, 254, 0);
      }
    }

    /* Efek sedikit membal pada badge */
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Ilapak</h1>
    <p>Pilih menu untuk melanjutkan</p>

    <div class="menu">
      <a href="counter.html">🔢 Hitung Counter</a>
      <!-- Menu Baru Ditambahkan Di Sini -->
      <a href="http://10.167.166.66:2005" class="new-item">
        📦 Monitoring Batch 
        <span class="badge-new">BARU</span>
      </a>
      <a href="https://b7pgd.github.io/ilapak/status/status.html">📋 Cek Status Release</a>
      <a href="http://10.167.170.74">💻 IPC Digital</a>
      <a href="http://10.167.170.74:81">📊 OEE Digital</a>
      <a href="https://b7pgd.github.io/ilapak/am.html">📱 AM Digital</a>
      <a href="https://b7pgd.github.io/ilapak/berat_jenis.html">🧪 Cek Berat Jenis</a>
      <a href="https://docs.google.com/spreadsheets/d/1yWEbd6U4bdMF_HT4W7OZhgZTV9WHQGBGC7-LclXY_14/edit?usp=drivesdk" target="_blank">🏷️ Red Tag / White Tag</a>
      <a href="setting.html">⚙️ Simulasi Setting Mesin</a>
    </div>

    <footer>
      © Ilapak
    </footer>
  </div>
</body>
</html>
