<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Lite Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #ffffff; --user-msg: #e7f1ff; --ai-msg: #ffffff; --text: #202124; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 220px; }
        
        .message { padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--user-msg); border-bottom-right-radius: 4px; max-width: 85%; }
        .user-content.collapsed { max-height: 60px; overflow: hidden; }
        .toggle-btn { display: block; color: #1a73e8; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .ai { align-self: flex-start; background: var(--ai-msg); border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; width: 90%; }
        
        /* Code Block Styles Fix */
        pre { background: #282c34; color: #abb2bf; padding: 15px; border-radius: 8px; overflow-x: auto; position: relative; font-size: 13px; margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
        code { font-family: 'Courier New', Courier, monospace; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: #444; color: white; border: none; padding: 4px 8px; font-size: 10px; border-radius: 4px; cursor: pointer; z-index: 10; }

        /* Typing Indicator */
        .typing { font-size: 13px; color: #1a73e8; font-style: italic; display: none; margin-left: 10px; }
        
        /* Fixed Input Area */
        #input-area { position: fixed; bottom: 0; width: 100%; background: #ffffff; padding: 15px; border-top: 1px solid #e0e0e0; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
        .top-row { display: flex; gap: 8px; align-items: center; }
        select { flex: 1; border: 1px solid #ccc; border-radius: 20px; padding: 8px; font-size: 13px; }
        input[type="file"] { flex: 2; border: 1px solid #ccc; border-radius: 20px; padding: 8px; font-size: 12px; }
        textarea { width: 100%; border: 1px solid #ccc; border-radius: 15px; padding: 15px; outline: none; resize: none; font-size: 15px; min-height: 120px; max-height: 250px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 20px; font-size: 15px; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="message ai">Halo Ghani, siap bantu riset atau diagnosa mesin hari ini?</div>
    <div id="typing-indicator" class="typing">AI sedang bersiap...</div>
</div>

<div id="input-area">
    <div class="top-row">
        <select id="modelSelect">
            <option value="gemini-3.1-flash-lite">Flash Lite</option>
            <option value="gemini-3.5-flash">Flash 3.5</option>
        </select>
        <input type="file" id="fileInput" accept=".pdf,.txt,.jpg,.png">
    </div>
    <textarea id="userInput" placeholder="Ketik atau upload PDF..."></textarea>
    <button onclick="handleSubmit()">Kirim Pesan</button>
</div>

<script>
    const API_KEY = "PASTE_HERE";

    function copyCode(btn) {
        const code = btn.nextElementSibling.innerText;
        navigator.clipboard.writeText(code);
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = "Copy", 2000);
    }

    function createMessage(text, isUser) {
        const div = document.createElement("div");
        div.className = `message ${isUser ? 'user' : 'ai'}`;
        if (isUser) {
            const isLong = text.length > 150;
            div.innerHTML = `<div class="user-content ${isLong ? 'collapsed' : ''}">${text.replace(/\n/g, '<br>')}</div>${isLong ? '<span class="toggle-btn" onclick="toggleMsg(this)">Tampilkan selengkapnya</span>' : ''}`;
        } else {
            let html = marked.parse(text);
            html = html.replace(/<pre>/g, '<div style="position:relative"><button class="copy-btn" onclick="copyCode(this)">Copy</button><pre>');
            html = html.replace(/<\/pre>/g, '</pre></div>');
            div.innerHTML = `<div class="ai-content">${html}</div>`;
        }
        return div;
    }

    function toggleMsg(btn) {
        const content = btn.previousElementSibling;
        content.classList.toggle('collapsed');
        btn.innerText = content.classList.contains('collapsed') ? 'Tampilkan selengkapnya' : 'Sembunyikan';
    }

    async function handleSubmit() {
        const inputArea = document.getElementById("userInput");
        const input = inputArea.value;
        if(!input) return;
        
        const container = document.getElementById("chat-container");
        const typing = document.getElementById("typing-indicator");
        
        container.insertBefore(createMessage(input, true), typing);
        inputArea.value = ""; 
        
        typing.innerText = "AI sedang mengunggah file...";
        typing.style.display = "block";
        container.scrollTop = container.scrollHeight;

        const file = document.getElementById("fileInput").files[0];
        let fileUri = null;
        if(file) {
            const formData = new FormData(); formData.append("file", file);
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/files?key=${API_KEY}`, { method: "POST", body: formData });
            const data = await res.json(); fileUri = data.file.uri;
            typing.innerText = "AI sedang menganalisis file...";
        } else {
            typing.innerText = "AI sedang menulis jawaban...";
        }

        const model = document.getElementById("modelSelect").value;
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: fileUri ? [{file_data: {file_uri: fileUri, mime_type: file.type}}, {text: input}] : [{text: input}] }] })
        });

        const data = await response.json();
        typing.style.display = "none";
        container.insertBefore(createMessage(data.candidates[0].content.parts[0].text, false), typing);
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
