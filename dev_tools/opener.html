<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Launcher</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            gap: 12px;
        }
        .url-text {
            font-size: 14px;
            color: #ccc;
            word-break: break-all;
        }
        .btn {
            font-size: 14px;
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            background: #0078ff;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn:hover {
            background: #005fd1;
        }
    </style>
</head>
<body>

<div class="container" id="list"></div>

<script>
const urls = [
    "https://gemini.google.com/",
    "https://b7pgd.github.io/ilapak/code.html",
    "https://b7pgd.github.io/ilapak/tools.html",
    "https://chatgpt.com/",
    "https://b7pgd.github.io/ilapak/code.html",
    "https://b7pgd.github.io/ilapak/dev_tools/app_viber/viber.html",
    "https://b7pgd.github.io/ilapak/dev_tools/app_viber2/viber.html",
    "https://b7pgd.github.io/ilapak/dev_tools/app_viber4/viber.html",
    "https://b7pgd.github.io/ilapak/dev_tools/app_prompt/prompt.html",
    "https://b7pgd.github.io/ilapak/tools.html"
];

const listContainer = document.getElementById("list");

urls.forEach((url, index) => {
    const item = document.createElement("div");
    item.className = "item";

    const text = document.createElement("span");
    text.className = "url-text";
    text.textContent = `${index + 1}. ${url}`;

    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = "RUN";
    btn.onclick = () => {
        window.open(url, "_blank");
    };

    item.appendChild(text);
    item.appendChild(btn);
    listContainer.appendChild(item);
});
</script>

</body>
</html>
