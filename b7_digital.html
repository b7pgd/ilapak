<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Rotator - Single Frame</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        iframe { width: 100vw; height: 100vh; border: none; display: block; }
        #setup-banner {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); color: #fff; padding: 12px 24px;
            border-radius: 30px; border: 2px solid #00e676; z-index: 9999;
            font-size: 14px; text-align: center; cursor: pointer; user-select: none;
        }
        #setup-banner span { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

    <div id="setup-banner" onclick="startRotator()">
        Silakan <b>LOGIN ADMIN OEE</b> di layar. Jika sudah masuk Dashboard, <span>KLIK DI SINI / KLIK LAYAR</span> untuk Mulai Rotasi!
    </div>

    <!-- Cukup GUNAKAN 1 IFRAME TUNGGAL agar browser TV tidak mendeteksi Cross-Origin Stacking -->
    <iframe id="main-frame" src="http://10.167.170.74:81/#/login"></iframe>

    <script>
        const mainFrame = document.getElementById('main-frame');
        const banner = document.getElementById('setup-banner');

        const URL_CLOCK = "http://10.167.166.109:8001";
        const URL_OEE = "http://10.167.170.74:81/#/";
        const DISPLAY_TIME = 30000; // 30 detik

        let currentScreen = 'oee';
        let isRotatorRunning = false;

        function startRotator() {
            if (isRotatorRunning) return;
            isRotatorRunning = true;
            banner.style.display = 'none';

            // Pindah langsung ke dashboard OEE
            mainFrame.src = URL_OEE;

            // Jalankan rotasi 1 iframe
            setInterval(switchScreen, DISPLAY_TIME);
        }

        function switchScreen() {
            if (currentScreen === 'oee') {
                mainFrame.src = URL_CLOCK;
                currentScreen = 'clock';
            } else {
                mainFrame.src = URL_OEE;
                currentScreen = 'oee';
            }
        }

        document.addEventListener('click', function() {
            if (!isRotatorRunning) startRotator();
        });
    </script>
</body>
</html>
