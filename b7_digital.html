<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Rotator - OEE & Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        .screen-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out;
            z-index: 1;
        }

        /* Saat awal, OEE dipaksa aktif duluan */
        iframe#frame-oee.active-init {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        iframe.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        /* Banner Petunjuk di Bawah Layar */
        #setup-banner {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            border: 2px solid #00e676;
            z-index: 9999;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            user-select: none;
        }

        #setup-banner span {
            color: #00e676;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="setup-banner" onclick="startRotator()">
        Silakan <b>LOGIN ADMIN</b> di layar. Jika sudah masuk Dashboard, <span>KLIK DI SINI / KLIK LAYAR</span> untuk Mulai Rotasi!
    </div>

    <div class="screen-container">
        <!-- Screen 1: Jam -->
        <iframe id="frame-clock" src="http://10.167.166.109:8001"></iframe>
        
        <!-- Screen 2: Dashboard OEE (Aktif Pertama Kali untuk Login) -->
        <iframe id="frame-oee" src="http://10.167.170.74:81/#/login" class="active-init"></iframe>
    </div>

    <script>
        const clockFrame = document.getElementById('frame-clock');
        const oeeFrame = document.getElementById('frame-oee');
        const banner = document.getElementById('setup-banner');

        const DISPLAY_TIME = 30000; // 30 detik per screen
        let currentScreen = 'oee';
        let isRotatorRunning = false;
        let rotationInterval = null;

        // --- FUNGSIONALITAS UTAMA: MULAI ROTASI ---
        function startRotator() {
            if (isRotatorRunning) return;

            isRotatorRunning = true;
            
            // Sembunyikan banner petunjuk
            banner.style.display = 'none';

            // Lepas class inisialisasi awal
            oeeFrame.classList.remove('active-init');
            
            // Set OEE sebagai screen aktif pertama dalam mode rotasi
            oeeFrame.classList.add('active');

            // Jalankan interval rotasi 30 detik
            rotationInterval = setInterval(switchScreen, DISPLAY_TIME);
        }

        // --- ROTASI SCREEN (30 DETIK) ---
        function switchScreen() {
            if (currentScreen === 'oee') {
                oeeFrame.classList.remove('active');
                clockFrame.classList.add('active');
                currentScreen = 'clock';
            } else {
                clockFrame.classList.remove('active');
                oeeFrame.classList.add('active');
                currentScreen = 'oee';
            }
        }

        // Izinkan pemicu rotasi lewat klik di mana saja pada dokumen
        document.addEventListener('click', function() {
            if (!isRotatorRunning) {
                startRotator();
            }
        });
    </script>
</body>
</html>
