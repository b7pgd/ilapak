<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotator TV Kiosk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* Container Pembungkus */
        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Banner Overlay Kios */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            pointer-events: none; /* Biar tetap bisa ngeklik form login di belakangnya */
        }

        .action-card {
            pointer-events: auto; /* Tombol aktif */
            background: #111;
            border: 2px solid #00e676;
            color: #fff;
            padding: 15px 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .action-card h3 {
            font-size: 16px;
            color: #00e676;
            margin-bottom: 5px;
        }

        .action-card p {
            font-size: 13px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- Frame Utama Tunggal -->
        <iframe id="kiosk-frame" src="about:blank"></iframe>
    </div>

    <!-- Banner Petunjuk Setup -->
    <div id="login-overlay">
        <div class="action-card" id="btn-action" onclick="handleStep()">
            <h3 id="txt-title">STEP 1: LOGIN OEE</h3>
            <p id="txt-desc">Silakan ketik user & pass di layar. Jika SUDAH MASUK DASHBOARD, KLIK DI SINI!</p>
        </div>
    </div>

    <script>
        const URL_OEE_LOGIN = "http://10.167.170.74:81/#/login";
        const URL_OEE_DASHBOARD = "http://10.167.170.74:81/#/";
        const URL_CLOCK = "http://10.167.166.109:8001";
        const DISPLAY_TIME = 30000; // 30 Detik

        const frame = document.getElementById('kiosk-frame');
        const overlay = document.getElementById('login-overlay');
        const txtTitle = document.getElementById('txt-title');
        const txtDesc = document.getElementById('txt-desc');

        let step = 1;
        let currentDisplay = 'oee';

        // Load awal: Set frame ke halaman login OEE
        frame.src = URL_OEE_LOGIN;

        function handleStep() {
            if (step === 1) {
                // Step 2: User mengonfirmasi sudah login
                step = 2;
                
                // Sembunyikan overlay total
                overlay.style.display = 'none';

                // Arahkan frame ke Dashboard OEE & Mulai Timer Rotasi
                frame.src = URL_OEE_DASHBOARD;
                
                setInterval(rotateDisplay, DISPLAY_TIME);
            }
        }

        function rotateDisplay() {
            if (currentDisplay === 'oee') {
                frame.src = URL_CLOCK;
                currentDisplay = 'clock';
            } else {
                frame.src = URL_OEE_DASHBOARD;
                currentDisplay = 'oee';
            }
        }
    </script>
</body>
</html>
