<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Rotator Master</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #111; 
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00e676;
            max-width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h2 { color: #00e676; margin-bottom: 15px; }
        p { font-size: 18px; margin-bottom: 25px; line-height: 1.5; }
        
        button {
            background: #00e676;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #00c853; transform: scale(1.05); }
        .status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ROTATOR DISPLAY TV</h2>
        <p id="info-text">
            Klik tombol di bawah untuk membuka **Dashboard OEE**. <br>
            Silakan **LOGIN** terlebih dahulu di tab/halaman tersebut!
        </p>
        <button id="main-btn" onclick="handleAction()">MULAI / LOGIN OEE</button>
        <div class="status" id="status-text">Status: Menunggu Login Pertama</div>
    </div>

    <script>
        const URL_OEE = "http://10.167.170.74:81/#/";
        const URL_CLOCK = "http://10.167.166.109:8001";
        const DISPLAY_TIME = 30000; // 30 Detik

        let targetWindow = null;
        let currentTarget = 'oee';
        let rotationInterval = null;

        function handleAction() {
            const btn = document.getElementById('main-btn');
            const info = document.getElementById('info-text');
            const status = document.getElementById('status-text');

            if (!rotationInterval) {
                // Step 1: Buka OEE pertama kali untuk login
                targetWindow = window.open(URL_OEE, '_blank');
                
                info.innerHTML = "<b>PENTING:</b> Buka tab OEE yang baru terbuka, lalu <b>LOGIN ADMIN</b>.<br>Jika sudah masuk Dashboard, kembali ke halaman ini dan klik tombol di bawah!";
                btn.innerText = "SAYA SUDAH LOGIN (MULAI ROTASI)";
                btn.style.background = "#ffab00";
                status.innerText = "Status: Selesaikan Login di Tab OEE";

                rotationInterval = 'WAITING_FOR_CONFIRM';
            } else if (rotationInterval === 'WAITING_FOR_CONFIRM') {
                // Step 2: User konfirmasi udah login, rotasi dimulai!
                info.innerHTML = "<b>ROTASI BERJALAN AUTOMATIS!</b><br>Layar ini akan mengontrol tampilan TV bergantian per 30 detik.";
                btn.style.display = "none";
                status.innerText = "Status: Rotasi Aktif (OEE <-> JAM)";

                // Jalankan Rotasi
                startLoop();
            }
        }

        function startLoop() {
            // Langsung arahkan tab tadi ke OEE dulu
            if (targetWindow && !targetWindow.closed) {
                targetWindow.location.href = URL_OEE;
            }

            setInterval(() => {
                if (!targetWindow || targetWindow.closed) {
                    // Kalau tab-nya ketutup, buka lagi
                    targetWindow = window.open(currentTarget === 'oee' ? URL_CLOCK : URL_OEE, '_blank');
                } else {
                    // Pindahkan URL tab tersebut tanpa terkena CORS!
                    if (currentTarget === 'oee') {
                        targetWindow.location.href = URL_CLOCK;
                        currentTarget = 'clock';
                    } else {
                        targetWindow.location.href = URL_OEE;
                        currentTarget = 'oee';
                    }
                }
            }, DISPLAY_TIME);
        }
    </script>
</body>
</html>
