<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Image Processor</title>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --danger-color: #dc2626;
            --danger-hover: #b91c1c;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            color: #111827;
            margin-bottom: 8px;
        }

        #items-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .add-step-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-title {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .item-title.image {
            background-color: #fef3c7;
            color: #92400e;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #4b5563;
        }

        .btn-secondary:hover {
            background-color: #374151;
        }

        .btn-success {
            background-color: #059669;
        }

        .btn-success:hover {
            background-color: #047857;
        }

        .btn-warning {
            background-color: #d97706;
        }

        .btn-warning:hover {
            background-color: #b45309;
        }

        .btn-danger {
            background-color: var(--danger-color);
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-action {
            background-color: #e5e7eb;
            color: #374151;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-action:hover {
            background-color: #d1d5db;
        }

        .image-uploader-box {
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .image-uploader-box:hover, .image-uploader-box.dragover {
            border-color: var(--accent-color);
            background-color: #eff6ff;
        }

        .file-info {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 2px dashed var(--border-color);
            color: #6b7280;
        }

        .bottom-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* Modal Preview Window */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background-color: white;
            max-width: 900px;
            margin: 20px auto;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-modal {
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background: none;
            color: #6b7280;
        }

        .modal-body-preview {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            min-height: 400px;
        }

        .modal-body-preview img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        .alert {
            padding: 12px 16px;
            background-color: #fee2e2;
            border-left: 4px solid var(--danger-color);
            color: #991b1b;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Book Image Processor</h1>
    </header>

    <div id="alert-box" class="alert"></div>

    <div id="items-container">
        <div class="empty-state" id="empty-state">
            Belum ada gambar. Klik tombol "+ Add Image" untuk menambahkan foto halaman buku.
        </div>
    </div>

    <div class="add-step-container">
        <button class="btn" onclick="addImageItem()">+ Add Image</button>
    </div>

    <div class="bottom-actions">
        <button class="btn btn-success" onclick="downloadPackZip()">Download Pack ZIP</button>
        <input type="file" id="zip-file-input" accept=".zip" style="display: none;" onchange="loadZipFile(event)">
        <button class="btn btn-warning" onclick="document.getElementById('zip-file-input').click()">📁 Load ZIP</button>
    </div>

    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="preview-modal-title">Preview Processed Image</h2>
                <button class="close-modal" onclick="closePreviewModal()">&times;</button>
            </div>
            <div class="modal-body-preview">
                <img id="preview-image-target" src="" alt="Processed Preview">
            </div>
        </div>
    </div>

    <script>
        let items = []; // State: { id: number, original: File|Blob, processed: Blob|null, isProcessing: boolean }
        let isCvReady = false;

        function onOpenCvReady() {
            isCvReady = true;
        }

        function showAlert(message) {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerText = '⚠ ' + message;
            alertBox.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 6000);
        }

        function addImageItem(file = null, render = true) {
            const newItem = {
                id: Date.now() + Math.random(),
                original: file,
                processed: null,
                isProcessing: false
            };
            items.push(newItem);

            if (file) {
                processItemImage(newItem);
            }
            if (render) renderItems();
        }

        function clearContent(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.original = null;
                item.processed = null;
                item.isProcessing = false;
                renderItems();
            }
        }

        function deleteContentWithConfirm(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            if (confirm(`Apakah Anda yakin ingin menghapus gambar ini?`)) {
                items = items.filter(i => i.id !== id);
                renderItems();
            }
        }

        async function handleFileSelect(id, file) {
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showAlert('File harus berupa gambar (JPG, PNG, WEBP, GIF, dll).');
                return;
            }
            const item = items.find(i => i.id === id);
            if (item) {
                item.original = file;
                item.processed = null;
                renderItems();
                await processItemImage(item);
                renderItems();
            }
        }

        async function processItemImage(item) {
            if (!item.original) return;
            item.isProcessing = true;
            try {
                item.processed = await runImagePipeline(item.original);
            } catch (err) {
                console.error(err);
                showAlert(`Gagal memproses gambar: ${err.message || err}`);
            } finally {
                item.isProcessing = false;
            }
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            const emptyState = document.getElementById('empty-state');

            if (items.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyState);
                emptyState.style.display = 'block';
                return;
            }

            container.innerHTML = '';
            let imageCounter = 0;

            items.forEach((item) => {
                imageCounter++;
                const itemIndex = imageCounter;

                const card = document.createElement('div');
                card.className = 'item-card';

                const header = document.createElement('div');
                header.className = 'item-header';

                const title = document.createElement('span');
                title.className = 'item-title image';
                title.innerText = `IMAGE #${itemIndex}`;

                const actions = document.createElement('div');
                actions.className = 'item-actions';

                const btnPreview = document.createElement('button');
                btnPreview.className = 'btn btn-secondary';
                btnPreview.style.padding = '6px 12px';
                btnPreview.style.fontSize = '0.8rem';
                btnPreview.innerText = item.isProcessing ? 'Processing...' : 'Preview';
                btnPreview.disabled = !item.processed || item.isProcessing;
                btnPreview.onclick = () => openPreviewModalForItem(item, itemIndex);

                const btnDownloadSingle = document.createElement('button');
                btnDownloadSingle.className = 'btn btn-success';
                btnDownloadSingle.style.padding = '6px 12px';
                btnDownloadSingle.style.fontSize = '0.8rem';
                btnDownloadSingle.innerText = 'Download JPG';
                btnDownloadSingle.disabled = !item.processed || item.isProcessing;
                btnDownloadSingle.onclick = () => downloadSingleJpg(item, itemIndex);

                const btnClear = document.createElement('button');
                btnClear.className = 'btn btn-action';
                btnClear.innerText = 'Clear';
                btnClear.onclick = () => clearContent(item.id);

                const btnHapus = document.createElement('button');
                btnHapus.className = 'btn btn-danger';
                btnHapus.innerText = 'Hapus';
                btnHapus.onclick = () => deleteContentWithConfirm(item.id);

                actions.appendChild(btnPreview);
                actions.appendChild(btnDownloadSingle);
                actions.appendChild(btnClear);
                actions.appendChild(btnHapus);

                header.appendChild(title);
                header.appendChild(actions);
                card.appendChild(header);

                const uploadBox = document.createElement('div');
                uploadBox.className = 'image-uploader-box';

                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.style.display = 'none';
                fileInput.onchange = (e) => handleFileSelect(item.id, e.target.files[0]);

                uploadBox.onclick = () => fileInput.click();

                uploadBox.ondragover = (e) => {
                    e.preventDefault();
                    uploadBox.classList.add('dragover');
                };
                uploadBox.ondragleave = () => uploadBox.classList.remove('dragover');
                uploadBox.ondrop = (e) => {
                    e.preventDefault();
                    uploadBox.classList.remove('dragover');
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        handleFileSelect(item.id, e.dataTransfer.files[0]);
                    }
                };

                if (item.original) {
                    const fileInfo = document.createElement('div');
                    fileInfo.className = 'file-info';
                    const fileName = item.original.name || `image_${itemIndex}.jpg`;
                    const statusText = item.isProcessing ? ' (Sedang diproses...)' : (item.processed ? ' (Siap / Processed)' : ' (Gagal diproses)');
                    fileInfo.innerText = `${fileName}${statusText} - Klik atau drag untuk mengganti`;
                    uploadBox.appendChild(fileInfo);
                } else {
                    uploadBox.innerText = 'Klik atau seret (drag & drop) gambar foto buku ke sini';
                }

                uploadBox.appendChild(fileInput);
                card.appendChild(uploadBox);
                container.appendChild(card);
            });
        }

        // --- HARDCODED IMAGE PROCESSING PIPELINE FOR BOOK PAGES ---
        async function runImagePipeline(fileOrBlob) {
            const img = await loadImage(fileOrBlob);

            let canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            // OpenCV logic check
            if (window.cv && isCvReady) {
                try {
                    canvas = processWithOpenCV(canvas);
                } catch (e) {
                    console.warn("OpenCV Processing error, fallbacking to Canvas enhancement:", e);
                    canvas = processWithCanvasFallback(canvas);
                }
            } else {
                canvas = processWithCanvasFallback(canvas);
            }

            // Portrait Lock Requirement
            if (canvas.width > canvas.height) {
                canvas = rotateCanvas90(canvas);
            }

            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error("Gagal mengkonversi canvas ke JPG."));
                }, 'image/jpeg', 0.92);
            });
        }

        function loadImage(fileOrBlob) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(fileOrBlob);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    resolve(img);
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error("Gagal memuat gambar."));
                };
                img.src = url;
            });
        }

        function processWithOpenCV(inputCanvas) {
            const src = cv.imread(inputCanvas);

            // 1. OCR Image Enhancement Pipeline (Grayscale, Contrast, Adaptive Thresholding)
            let grayFinal = new cv.Mat();
            cv.cvtColor(src, grayFinal, cv.COLOR_RGBA2GRAY);

            // Adaptive Thresholding: meratakan pencahayaan latar belakang & menajamkan teks untuk hasil OCR optimal
            let enhanced = new cv.Mat();
            cv.adaptiveThreshold(grayFinal, enhanced, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 21, 10);

            // Safe Margin (padding)
            let padded = new cv.Mat();
            let margin = 20;
            cv.copyMakeBorder(enhanced, padded, margin, margin, margin, margin, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));

            const outCanvas = document.createElement('canvas');
            cv.imshow(outCanvas, padded);

            // Clean OpenCV memory
            src.delete(); grayFinal.delete();
            enhanced.delete(); padded.delete();

            return outCanvas;
        }

        function processWithCanvasFallback(inputCanvas) {
            const width = inputCanvas.width;
            const height = inputCanvas.height;

            const margin = Math.round(Math.min(width, height) * 0.02);
            const outCanvas = document.createElement('canvas');
            outCanvas.width = width + (margin * 2);
            outCanvas.height = height + (margin * 2);
            const ctx = outCanvas.getContext('2d');

            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);

            // Optimized Grayscale & High Contrast for OCR (Teks Hitam Peformatan Bersih)
            ctx.filter = 'grayscale(100%) contrast(180%) brightness(115%)';
            ctx.drawImage(inputCanvas, margin, margin, width, height);

            return outCanvas;
        }

        function rotateCanvas90(inputCanvas) {
            const canvas = document.createElement('canvas');
            canvas.width = inputCanvas.height;
            canvas.height = inputCanvas.width;
            const ctx = canvas.getContext('2d');

            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate((90 * Math.PI) / 180);
            ctx.drawImage(inputCanvas, -inputCanvas.width / 2, -inputCanvas.height / 2);

            return canvas;
        }

        // --- ACTIONS & MODAL PREVIEW ---
        function openPreviewModalForItem(item, number) {
            if (!item.processed) return;
            const targetImg = document.getElementById('preview-image-target');
            targetImg.src = URL.createObjectURL(item.processed);
            document.getElementById('preview-modal-title').innerText = `Preview Image #${number}`;
            document.getElementById('preview-modal').style.display = 'block';
        }

        function closePreviewModal() {
            document.getElementById('preview-modal').style.display = 'none';
        }

        function downloadSingleJpg(item, number) {
            if (!item.processed) return;
            const link = document.createElement('a');
            link.href = URL.createObjectURL(item.processed);
            link.download = `${number}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        async function downloadPackZip() {
            if (typeof JSZip === 'undefined') {
                showAlert('Library JSZip gagal dimuat.');
                return;
            }

            const validItems = items.filter(i => i.processed && !i.isProcessing);
            if (validItems.length === 0) {
                showAlert('Tidak ada gambar yang selesai diproses untuk di-download.');
                return;
            }

            const zip = new JSZip();

            try {
                let count = 0;
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.processed) {
                        count++;
                        zip.file(`${count}.jpg`, item.processed);
                    }
                }

                const content = await zip.generateAsync({ type: 'blob' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = 'book-processed.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
            } catch (err) {
                console.error(err);
                showAlert(`Gagal membuat ZIP: ${err.message}`);
            }
        }

        async function loadZipFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (typeof JSZip === 'undefined') {
                showAlert('Library JSZip gagal dimuat.');
                return;
            }

            try {
                const zip = await JSZip.loadAsync(file);
                const imageEntries = [];

                zip.forEach((relativePath, zipEntry) => {
                    if (!zipEntry.dir && /\.(jpe?g|png|webp)$/i.test(zipEntry.name)) {
                        imageEntries.push(zipEntry);
                    }
                });

                if (imageEntries.length === 0) {
                    showAlert('File ZIP tidak berisi gambar yang valid!');
                    return;
                }

                // Natural numeric sort by filename
                imageEntries.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

                for (const entry of imageEntries) {
                    const blob = await entry.async("blob");
                    const imageFile = new File([blob], entry.name, { type: blob.type || 'image/jpeg' });
                    addImageItem(imageFile, false);
                }

                renderItems();
            } catch (err) {
                console.error(err);
                showAlert("Gagal membaca file ZIP: " + err.message);
            } finally {
                event.target.value = '';
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('preview-modal');
            if (event.target === modal) {
                closePreviewModal();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            addImageItem(null, true);
        });
    </script>
</body>
</html>
