<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Menu Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-blue-50 min-h-screen antialiased p-4 sm:p-6">

    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- KIRI: FORM INPUT DATA MASSAL -->
        <div class="bg-white rounded-2xl shadow-sm border border-blue-100 p-5 flex flex-col gap-4 h-fit">
            <div class="border-b border-gray-100 pb-3">
                <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> Menu Generator
                </h1>
                <p class="text-xs text-gray-400 mt-1">Input judul dan link secara massal dipisahkan dengan tanda koma.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nama Aplikasi / Judul Utama</label>
                <input type="text" id="main-title" value="Dev Tools" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium">
            </div>

            <!-- Input Massal Judul Menu -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Daftar Judul Menu (Pisah dengan koma)</label>
                <textarea 
                    id="bulk-labels" 
                    class="w-full h-28 p-3 text-gray-700 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono placeholder-gray-400"
                    placeholder="Facebook,&#10;YouTube,&#10;Google"></textarea>
            </div>

            <!-- Input Massal URL/Link Menu -->
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Daftar Link Menu (Pisah dengan koma)</label>
                <textarea 
                    id="bulk-urls" 
                    class="w-full h-28 p-3 text-gray-700 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-mono placeholder-gray-400"
                    placeholder="facebook.com,&#10;youtube.com,&#10;google.com"></textarea>
            </div>

            <div class="pt-2">
                <button id="btn-generate" class="w-full flex items-center justify-center gap-2 py-3 px-4 bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-medium rounded-xl shadow-md shadow-blue-100 transition-all text-sm">
                    <i data-lucide="cog" class="w-4 h-4"></i> Generate HTML
                </button>
            </div>
        </div>

        <!-- KANAN: OUTPUT HASIL HTML KODE -->
        <div class="bg-white rounded-2xl shadow-sm border border-blue-100 p-5 flex flex-col gap-4 min-h-[400px]">
            <div class="border-b border-gray-100 pb-3 flex justify-between items-center">
                <div>
                    <h2 class="text-base font-bold text-gray-700">Output Source Code HTML</h2>
                    <p class="text-xs text-gray-400 mt-0.5">Hasil kode HTML murni siap lu pakai atau simpan.</p>
                </div>
                <div class="flex gap-2">
                    <button id="btn-copy" class="p-2 bg-gray-50 hover:bg-gray-100 text-gray-600 rounded-lg border border-gray-200 active:scale-95 transition-all" title="Salin Code">
                        <i data-lucide="copy" class="w-4 text-gray-600 h-4"></i>
                    </button>
                    <button id="btn-download" class="p-2 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg border border-blue-200 active:scale-95 transition-all" title="Download File .html">
                        <i data-lucide="download" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col">
                <textarea 
                    id="output-code" 
                    readonly
                    class="w-full flex-1 min-h-[350px] p-4 font-mono text-xs text-gray-800 bg-gray-900 rounded-xl border border-gray-800 focus:outline-none resize-none text-white"
                    placeholder="Klik 'Generate HTML' untuk melihat hasil kode di sini..."></textarea>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        const btnGenerate = document.getElementById('btn-generate');
        const btnCopy = document.getElementById('btn-copy');
        const btnDownload = document.getElementById('btn-download');
        const mainTitleInput = document.getElementById('main-title');
        const bulkLabels = document.getElementById('bulk-labels');
        const bulkUrls = document.getElementById('bulk-urls');
        const outputCode = document.getElementById('output-code');

        // Fungsi Membuat Template HTML Berdasarkan Parsing Koma Massal
        btnGenerate.addEventListener('click', () => {
            const titleValue = mainTitleInput.value.trim() || "Menu Utama";
            
            // Memecah teks berdasarkan koma dan membersihkan spasi/baris baru di sekitarnya
            const rawLabels = bulkLabels.value.split(',');
            const rawUrls = bulkUrls.value.split(',');

            let linksHtmlMarkup = '';

            // Lakukan perulangan berdasarkan jumlah item label yang di-input
            for (let i = 0; i < rawLabels.length; i++) {
                const label = rawLabels[i] ? rawLabels[i].trim() : '';
                let url = rawUrls[i] ? rawUrls[i].trim() : '';

                // Lewati iterasi jika baris kosong
                if (!label || !url) continue;

                // Auto-prefix protokol jika tidak diawali file.html lokal atau http/https asli
                if (!url.startsWith('http://') && !url.startsWith('https://') && !url.endsWith('.html')) {
                    url = 'https://' + url;
                }

                const isExternal = url.startsWith('http') && (url.includes('google.com') || url.includes('drive'));
                const targetAttribute = isExternal ? ' target="_blank"' : '';
                
                linksHtmlMarkup += `      <a href="${url}"${targetAttribute}>${label}</a>\n`;
            }

            const templateHtml = `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${titleValue}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-bottom: 32px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu a {
      text-decoration: none;
      background: #ffffff;
      color: #203a43;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .menu a:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.35);
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>${titleValue}</h1>
    <p>Pilih menu untuk melanjutkan</p>

    <div class="menu">
${linksHtmlMarkup || '      '}    </div>

    <footer>
      © ${titleValue}
    </footer>
  </div>
</body>
</html>`;

            outputCode.value = templateHtml;
        });

        // Fitur Salin Teks Code Otomatis (Tanpa Pop-up)
        btnCopy.addEventListener('click', () => {
            if (!outputCode.value.trim()) return;
            navigator.clipboard.writeText(outputCode.value).then(() => {
                const originalIcon = btnCopy.innerHTML;
                btnCopy.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-green-600"></i>`;
                lucide.createIcons();
                setTimeout(() => {
                    btnCopy.innerHTML = originalIcon;
                    lucide.createIcons();
                }, 1200);
            });
        });

        // Fitur Auto Download File Langsung jadi .html
        btnDownload.addEventListener('click', () => {
            const code = outputCode.value.trim();
            if (!code) return;
            
            const titleValue = mainTitleInput.value.trim() || "menu";
            const blob = new Blob([code], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement("a");
            a.href = url;
            a.download = `${titleValue.toLowerCase().replace(/\s+/g, '_')}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
