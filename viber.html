<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Skeleton Map</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --code-bg: #0f172a;
            --code-text: #38bdf8;
        }


        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }


        .app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }


        h2 {
            color: var(--primary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 24px;
        }


        .setup-box {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            border: 1px dashed var(--primary);
        }


        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }


        .file-box {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            max-height: 250px;
            overflow-y: auto;
        }


        .file-box h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }


        .output-box {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }


        ul { list-style: none; padding: 0; margin: 0; }


        li {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }


        li:hover { background: #f1f5f9; color: var(--primary); }
        li input[type="checkbox"] { cursor: pointer; transform: scale(1.1); }


        .active { background: #dbeafe !important; color: var(--primary) !important; font-weight: bold; }


        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }


        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
            min-width: 200px;
            text-align: center;
            font-size: 13px;
        }


        button:hover { background: #15803d; }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }


        textarea {
            flex: 1;
            background: var(--code-bg);
            color: var(--code-text);
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            padding: 15px;
            border: 1px solid var(--code-bg);
            border-radius: 6px;
            resize: none;
            min-height: 400px;
            margin-top: 10px;
            line-height: 1.5;
        }


        .path-banner {
            color: #d97706;
            font-weight: bold;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 13px;
        }


        .file-input-btn {
            background: var(--primary);
            padding: 10px 15px;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            transition: background 0.2s;
        }


        .file-input-btn:hover { background: var(--primary-hover); }
        input[type="file"] { display: none; }


        @media (max-width: 768px) {
            body { padding: 10px; }
            .setup-box { flex-direction: column; align-items: flex-start; }
            textarea { min-height: 300px; }
            button { width: 100%; flex: none; }
        }
    </style>
</head>
<body>


    <div class="app-wrapper">
        <h2>⚡ Skeleton Map</h2>


        <div class="setup-box">
            <div><strong>Step 1: Pilih Folder Project Lo:</strong></div>
            <label class="file-input-btn">
                📂 PILIH FOLDER PROJECT
                <input type="file" id="folderPicker" webkitdirectory directory multiple>
            </label>
            <div id="statusText" style="color: var(--text-muted); font-size: 14px;">Belum ada folder yang dipilih</div>
        </div>


        <div class="container">
            <div class="file-box">
                <h3>Daftar File Project (<span id="fileCount">0</span>) [Selected: <span id="selectedCount">0</span>]</h3>
                <div class="btn-group" style="margin-bottom: 10px;">
                    <button id="btnSelectAll" onclick="selectAllFiles()" style="background: #475569; min-width: 120px; padding: 6px 12px;" disabled>🗹 SELECT ALL</button>
                    <button id="btnUnselectAll" onclick="unselectAllFiles()" style="background: #64748b; min-width: 120px; padding: 6px 12px;" disabled>☐ UNSELECT ALL</button>
                </div>
                <ul id="fileList">
                    <li style="color: var(--text-muted); cursor: default; background: none;">Silakan pilih folder terlebih dahulu...</li>
                </ul>
            </div>


            <div class="output-box">
                <div class="btn-group">
                    <button id="btnExtract" onclick="extractSkeleton()" disabled>⚓ MODE 1: SKELETON ANCHOR</button>
                    <button id="btnExtractSemantic" onclick="extractSemanticSkeleton()" style="background: #0284c7;" disabled>🏛️ MODE 2: ARCHITECTURE MAP</button>
                    <button id="btnExtractExact" onclick="extractExactFull()" style="background: #ea580c;" disabled>🔥 MODE 3: EXACT FULL CONTENT</button>
                </div>
                <div class="btn-group" style="margin-top: 5px;">
                    <button id="btnCopy" onclick="copyToClipboard()" style="background: #4f46e5;">📋 COPY OUTPUT</button>
                    <button id="btnDownload" onclick="downloadAsTxt()" style="background: #0284c7;">💾 DOWNLOAD .TXT</button>
                </div>
                <div class="path-banner" id="pathBanner" style="margin-top: 15px;">Pilih file dari daftar di atas...</div>
                <textarea id="outputArea" readonly placeholder="Hasil ekstraksi sesuai mode yang dipilih akan muncul di sini..."></textarea>
            </div>
        </div>
    </div>


    <script>
        let projectFiles = {};
        let selectedFileKeys = [];


        document.getElementById('folderPicker').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;


            projectFiles = {};
            selectedFileKeys = [];
            updateActionButtons();
            const fileListUI = document.getElementById('fileList');
            fileListUI.innerHTML = '';


            let counted = 0;
            
            // Daftar ekstensi anomali / biner yang wajib diabaikan
            const blacklistedExtensions = [
                '.zip', '.exe', '.bin', '.png', '.jpg', '.jpeg', '.gif', 
                '.ico', '.mp4', '.mp3', '.pdf', '.ttf', '.woff', '.woff2', '.eot'
            ];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const path = file.webkitRelativePath;
                const lowerFileName = file.name.toLowerCase();


                if (path.includes('/.git/') ||
                    path.includes('/node_modules/') ||
                    path.includes('/.idea/') ||
                    path.includes('/uploads/') ||
                    path.includes('/assets/')) {
                    continue;
                }


                // Validasi apakah file bukan termasuk anomali biner
                const isAnomaly = blacklistedExtensions.some(ext => lowerFileName.endsWith(ext));

                if (!isAnomaly) {
                    projectFiles[path] = file;


                    const li = document.createElement('li');
                    
                    const chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.value = path;
                    chk.onclick = function(e) { e.stopPropagation(); toggleFileSelect(this.checked, path); };

                    const label = document.createElement('span');
                    label.textContent = path;

                    li.appendChild(chk);
                    li.appendChild(label);
                    li.title = path;
                    li.onclick = function() { 
                        const checkbox = this.querySelector('input[type="checkbox"]');
                        checkbox.checked = !checkbox.checked;
                        toggleFileSelect(checkbox.checked, path);
                    };

                    fileListUI.appendChild(li);
                    counted++;
                }
            }


            document.getElementById('statusText').innerText = 'Berhasil memuat folder!';
            document.getElementById('fileCount').innerText = counted;
            
            const hasFiles = counted > 0;
            document.getElementById('btnSelectAll').disabled = !hasFiles;
            document.getElementById('btnUnselectAll').disabled = !hasFiles;
        });


        function toggleFileSelect(isChecked, fileKey) {
            const listItems = document.querySelectorAll('#fileList li');
            let targetLi = null;
            for (let li of listItems) {
                if (li.title === fileKey) {
                    targetLi = li;
                    break;
                }
            }

            if (isChecked) {
                if (!selectedFileKeys.includes(fileKey)) {
                    selectedFileKeys.push(fileKey);
                }
                if (targetLi) targetLi.classList.add('active');
            } else {
                selectedFileKeys = selectedFileKeys.filter(k => k !== fileKey);
                if (targetLi) targetLi.classList.remove('active');
            }

            document.getElementById('selectedCount').innerText = selectedFileKeys.length;

            if (selectedFileKeys.length > 0) {
                document.getElementById('pathBanner').innerText = `Target Aktif: ${selectedFileKeys.length} File terpilih`;
            } else {
                document.getElementById('pathBanner').innerText = 'Pilih file dari daftar di atas...';
            }
            updateActionButtons();
        }

        function selectAllFiles() {
            selectedFileKeys = [];
            const checkboxes = document.querySelectorAll('#fileList li input[type="checkbox"]');
            checkboxes.forEach(chk => {
                chk.checked = true;
                const path = chk.value;
                if (!selectedFileKeys.includes(path)) {
                    selectedFileKeys.push(path);
                }
            });
            const listItems = document.querySelectorAll('#fileList li');
            listItems.forEach(li => li.classList.add('active'));
            
            document.getElementById('selectedCount').innerText = selectedFileKeys.length;
            document.getElementById('pathBanner').innerText = `Target Aktif: ${selectedFileKeys.length} File terpilih`;
            updateActionButtons();
        }

        function unselectAllFiles() {
            selectedFileKeys = [];
            const checkboxes = document.querySelectorAll('#fileList li input[type="checkbox"]');
            checkboxes.forEach(chk => {
                chk.checked = false;
            });
            const listItems = document.querySelectorAll('#fileList li');
            listItems.forEach(li => li.classList.remove('active'));
            
            document.getElementById('selectedCount').innerText = 0;
            document.getElementById('pathBanner').innerText = 'Pilih file dari daftar di atas...';
            updateActionButtons();
        }

        function updateActionButtons() {
            const hasSelection = selectedFileKeys.length > 0;
            document.getElementById('btnExtract').disabled = !hasSelection;
            document.getElementById('btnExtractSemantic').disabled = !hasSelection;
            document.getElementById('btnExtractExact').disabled = !hasSelection;
        }


        function extractSkeleton() {
            if (selectedFileKeys.length === 0) return;

            let finalOutputArray = [];
            let processedCount = 0;

            selectedFileKeys.forEach(fileKey => {
                const file = projectFiles[fileKey];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const rawCode = e.target.result;
                    const lines = rawCode.split('\n');
                    let finalResultArray = [];
                    finalResultArray.push("Target File: /" + fileKey);


                    // --- FLOW BACKEND PARSER (GO) ---
                    if (file.name.endsWith('.go')) {
                        let inImport = false;
                        let braceCount = 0;
                        let inFunction = false;
                        let funcStartLine = 0;
                        let funcSignature = "";


                        for (let i = 0; i < lines.length; i++) {
                            let lineNum = i + 1;
                            let line = lines[i];
                            let trimmed = line.trim();


                            if (trimmed.startsWith('package ')) {
                                finalResultArray.push("// Baris " + lineNum + "\n" + line);
                                continue;
                            }
                            if (trimmed.startsWith('import (')) {
                                inImport = true;
                                finalResultArray.push("\n// Baris " + lineNum + "\n" + line);
                                continue;
                            }
                            if (inImport) {
                                finalResultArray.push(line);
                                if (trimmed === ')') {
                                    inImport = false;
                                    finalResultArray.push("// ... structural details hidden ...");
                                }
                                continue;
                            }


                            if (trimmed.startsWith('func ') && !inFunction) {
                                inFunction = true;
                                funcStartLine = lineNum;
                                funcSignature = line;


                                braceCount += (line.match(/\u007B/g) || []).length;
                                braceCount -= (line.match(/\u007D/g) || []).length;


                                if (braceCount === 0 && line.includes('\u007B')) {
                                    let cleanSignature = funcSignature.trim().replace(/\s*\{$/, "");
                                    finalResultArray.push("// Baris " + funcStartLine + "\n" + cleanSignature + " \u007B\n\t// ... body hidden ...\n\u007D");
                                    inFunction = false;
                                }
                                continue;
                            }


                            if (inFunction) {
                                braceCount += (line.match(/\u007B/g) || []).length;
                                braceCount -= (line.match(/\u007D/g) || []).length;


                                if (braceCount === 0) {
                                    let cleanSignature = funcSignature.trim().replace(/\s*\{$/, "");
                                    finalResultArray.push("// Baris " + funcStartLine + "-" + lineNum + "\n" + cleanSignature + " \u007B\n\t// ... body hidden ...\n\u007D");
                                    inFunction = false;
                                }
                            }
                        }
                        finalOutputArray.push(finalResultArray.join('\n'));
                    }


                    // --- FLOW FRONTEND PARSER (HTML / SMART SKELETON v2) ---
                    else if (file.name.endsWith('.html')) {
                        let inBlock = null;
                        let blockStartLine = 0;


                        for (let i = 0; i < lines.length; i++) {
                            let lineNum = i + 1;
                            let line = lines[i];
                            let trimmed = line.trim();


                            if (trimmed.startsWith('\u003Cstyle\u003E') || trimmed.startsWith('\u003Cstyle ')) {
                                inBlock = 'style';
                                blockStartLine = lineNum;
                                finalResultArray.push("// Baris " + lineNum + ": \u003Cstyle\u003E (Mulai Blok CSS)");
                                continue;
                            }
                            if (trimmed.startsWith('\u003Cscript\u003E') || trimmed.startsWith('\u003Cscript ')) {
                                inBlock = 'script';
                                blockStartLine = lineNum;
                                finalResultArray.push("// Baris " + lineNum + ": \u003Cscript\u003E (Mulai Blok JS)");
                                continue;
                            }


                            if (inBlock === 'style' && trimmed.startsWith('\u003C/style\u003E')) {
                                finalResultArray.push("// Baris " + blockStartLine + "-" + lineNum + " [CSS SKELETON GENERATED]");
                                finalResultArray.push("// Baris " + lineNum + ": \u003C/style\u003E");
                                inBlock = null;
                                continue;
                            }
                            if (inBlock === 'script' && trimmed.startsWith('\u003C/script\u003E')) {
                                finalResultArray.push("// Baris " + blockStartLine + "-" + lineNum + " [JS SCRIPT SKELETON GENERATED]");
                                finalResultArray.push("// Baris " + lineNum + ": \u003C/script\u003E");
                                inBlock = null;
                                continue;
                            }


                            if (inBlock === 'style') {
                                if (trimmed.includes('\u007B')) {
                                    let selector = trimmed.split('\u007B')[0].trim();
                                    finalResultArray.push("  // Baris " + lineNum + ": " + selector + " \u007B ... properti kosmetik disembunyikan ... \u007D");
                                }
                                continue;
                            }


                            if (inBlock === 'script') {
                                let arrowStr = '\u003D\u003E';
                                if (trimmed.startsWith('function ') || trimmed.includes('.addEventListener(') || trimmed.includes(' \u003D function(') || (trimmed.startsWith('let ') && trimmed.includes(arrowStr)) || (trimmed.startsWith('const ') && trimmed.includes(arrowStr))) {
                                    finalResultArray.push("  // Baris " + lineNum + ": " + trimmed + " \u003D\u003E [Isi logika disembunyikan]");
                                }
                                continue;
                            }


                            if (!inBlock) {
                                finalResultArray.push("// Baris " + lineNum + ": " + line);
                            }
                        }
                        finalOutputArray.push(finalResultArray.join('\n'));
                    }


                    // --- FLOW SEPARATED JS / CSS FILE TRACING ---
                    else if (file.name.endsWith('.js')) {
                        for (let i = 0; i < lines.length; i++) {
                            let lineNum = i + 1;
                            let line = lines[i];
                            let trimmed = line.trim();
                            let arrowStr = '\u003D\u003E';
                            if (trimmed.startsWith('function ') || trimmed.includes('.addEventListener(') || trimmed.includes(' \u003D function(') || (trimmed.startsWith('let ') && trimmed.includes(arrowStr)) || (trimmed.startsWith('const ') && trimmed.includes(arrowStr))) {
                                finalResultArray.push("// Baris " + lineNum + ": " + trimmed + " \u003D\u003E [Isi logika disembunyikan]");
                            }
                        }
                        finalOutputArray.push(finalResultArray.join('\n'));
                    }


                    else if (file.name.endsWith('.css')) {
                        for (let i = 0; i < lines.length; i++) {
                            let lineNum = i + 1;
                            let line = lines[i];
                            let trimmed = line.trim();
                            if (trimmed.includes('\u007B')) {
                                let selector = trimmed.split('\u007B')[0].trim();
                                finalResultArray.push("// Baris " + lineNum + ": " + selector + " \u007B ... properti kosmetik disembunyikan ... \u007D");
                            }
                        }
                        finalOutputArray.push(finalResultArray.join('\n'));
                    }


                    // --- FLOW BACKUP (PHP, JSON, ENV, PY, XML, UI, DLL) ---
                    else {
                        finalResultArray.push("// Baris 1-" + lines.length);
                        finalResultArray.push(rawCode);
                        finalOutputArray.push(finalResultArray.join('\n'));
                    }

                    processedCount++;
                    if (processedCount === selectedFileKeys.length) {
                        document.getElementById('outputArea').value = finalOutputArray.join('\n\n=========================================\n\n');
                    }
                };
                reader.readAsText(file);
            });
        }


        function extractSemanticSkeleton() {
            if (selectedFileKeys.length === 0) return;

            let finalOutputArray = [];
            let processedCount = 0;

            selectedFileKeys.forEach(fileKey => {
                const file = projectFiles[fileKey];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const rawCode = e.target.result;
                    const lines = rawCode.split('\n');
                    let semanticOutput = [];

                    semanticOutput.push("FILE:");
                    semanticOutput.push(`/${fileKey}`);
                    semanticOutput.push("");

                    // --- PURPOSES INFERENCE BASED ON PATH & NAME ---
                    let purpose = "General Module / Utility Component";
                    let lowerPath = fileKey.toLowerCase();
                    if (lowerPath.includes('auth') || lowerPath.includes('login')) purpose = "Authentication & User Session Management";
                    else if (lowerPath.includes('controller')) purpose = "Request Handler & Business Logic Controller";
                    else if (lowerPath.includes('route') || lowerPath.includes('router')) purpose = "API Routing & Endpoint Mapping";
                    else if (lowerPath.includes('model') || lowerPath.includes('struct') || lowerPath.includes('entity')) purpose = "Data Schema / State Entity Definition";
                    else if (lowerPath.includes('service')) purpose = "Core Business Logic & External Integration Service";
                    else if (lowerPath.includes('util') || lowerPath.includes('helper')) purpose = "Shared Helper Utilities";
                    else if (file.name.endsWith('.html')) purpose = "UI Template & View Presentation";

                    semanticOutput.push("PURPOSE:");
                    semanticOutput.push(purpose);
                    semanticOutput.push("");

                    // --- DEPENDENCY & IMPORTS ---
                    let dependencies = [];
                    for (let line of lines) {
                        let trimmed = line.trim();
                        if (trimmed.startsWith('import ') || trimmed.includes('require(') || trimmed.includes('<script src=')) {
                            dependencies.push(trimmed.replace(/;<.*$/, ''));
                        }
                    }
                    semanticOutput.push("DEPENDENCY:");
                    if (dependencies.length > 0) {
                        dependencies.slice(0, 10).forEach(d => semanticOutput.push(`- ${d}`));
                    } else {
                        semanticOutput.push("- None");
                    }
                    semanticOutput.push("");

                    // --- PARSER ENGINE UNTUK JS & HTML ---
                    if (file.name.endsWith('.js') || file.name.endsWith('.html')) {
                        let publicApis = [];
                        let flowSteps = [];
                        let endpoints = [];

                        // Pass 1: Kumpulkan semua nama fungsi lokal yang didefinisikan di file
                        let localFunctions = new Set();
                        for (let i = 0; i < lines.length; i++) {
                            let trimmed = lines[i].trim();
                            if (trimmed.startsWith('function ') || (trimmed.includes('const ') && trimmed.includes('=>')) || (trimmed.includes('let ') && trimmed.includes('=>')) || trimmed.startsWith('export function ') || trimmed.startsWith('export const ')) {
                                let funcName = "";
                                if (trimmed.includes('function ')) {
                                    funcName = trimmed.split('(')[0].replace('export ', '').replace('function ', '').trim();
                                } else {
                                    funcName = trimmed.split('=')[0].replace('export ', '').replace('const ', '').replace('let ', '').trim();
                                }
                                if (funcName) localFunctions.add(funcName);
                            }
                        }

                        // Event Triggers & Inline Call Handlers
                        for (let i = 0; i < lines.length; i++) {
                            let line = lines[i];
                            if (line.includes('addEventListener(')) {
                                let match = line.match(/(?:document\.getElementById\(['"]([^'"]+)['"]\)|document\.querySelector\(['"]([^'"]+)['"]\)|(\$?[a-zA-Z0-9_]+))\s*\.\s*addEventListener\(['"]([^'"]+)['"]\s*,\s*([a-zA-Z0-9_]+)/);
                                if (match) {
                                    let target = match[1] ? `#${match[1]}` : (match[2] || match[3] || 'document');
                                    let event = match[4];
                                    let fn = match[5];
                                    flowSteps.push(`[UI Event] ${target} (${event}) -> ${fn}()`);
                                }
                            }
                        }

                        // Pass 2: Function Tracing & Call Graph (Hanya fungsi lokal)
                        for (let i = 0; i < lines.length; i++) {
                            let trimmed = lines[i].trim();

                            if (trimmed.startsWith('function ') || (trimmed.includes('const ') && trimmed.includes('=>')) || (trimmed.includes('let ') && trimmed.includes('=>')) || trimmed.startsWith('export function ') || trimmed.startsWith('export const ')) {
                                let funcName = "";
                                if (trimmed.includes('function ')) {
                                    funcName = trimmed.split('(')[0].replace('export ', '').replace('function ', '').trim();
                                } else {
                                    funcName = trimmed.split('=')[0].replace('export ', '').replace('const ', '').replace('let ', '').trim();
                                }

                                if (!funcName) continue;
                                publicApis.push(funcName);

                                // Scope Isolation ({...})
                                let braceCount = 0;
                                let startedBrace = false;
                                let funcEndIdx = lines.length - 1;

                                for (let j = i; j < lines.length; j++) {
                                    let openCount = (lines[j].match(/\{/g) || []).length;
                                    let closeCount = (lines[j].match(/\}/g) || []).length;

                                    if (openCount > 0) startedBrace = true;
                                    braceCount += openCount - closeCount;

                                    if (startedBrace && braceCount <= 0) {
                                        funcEndIdx = j;
                                        break;
                                    }
                                }

                                let bodyText = lines.slice(i, funcEndIdx + 1).join('\n');

                                // API Requests / Endpoints
                                let reqMatch = bodyText.match(/(?:fetch|axios|\$.ajax)\s*\(\s*[`'"]([^`'"]+)[`'"]/);
                                let methodMatch = bodyText.match(/method\s*:\s*['"]([A-Z]+)['"]/i) || bodyText.match(/(GET|POST|PUT|DELETE|PATCH)/);
                                if (reqMatch) {
                                    let ep = `${methodMatch ? methodMatch[1].toUpperCase() : 'GET'} ${reqMatch[1]}`;
                                    if (!endpoints.includes(ep)) endpoints.push(ep);
                                }

                                // Function Call Chain (Filter hanya pemanggilan ke fungsi lokal)
                                let internalCalls = [];
                                let callMatches = bodyText.matchAll(/([a-zA-Z0-9_]+)\s*\(/g);
                                for (let cm of callMatches) {
                                    let fn = cm[1];
                                    if (fn !== funcName && localFunctions.has(fn)) {
                                        if (!internalCalls.includes(fn)) internalCalls.push(fn);
                                    }
                                }

                                if (internalCalls.length > 0) {
                                    flowSteps.push(`${funcName}() -> ${internalCalls.join(' -> ')}`);
                                }
                            }
                        }

                        semanticOutput.push("PUBLIC API / EXPORT:");
                        if (publicApis.length > 0) {
                            publicApis.forEach(fn => semanticOutput.push(`- ${fn}()`));
                        } else {
                            semanticOutput.push("- None (Internal / Anonymous Script)");
                        }
                        semanticOutput.push("");

                        semanticOutput.push("FLOW / CALL GRAPH:");
                        if (flowSteps.length > 0) {
                            flowSteps.forEach(s => semanticOutput.push(`  ${s}`));
                        } else {
                            semanticOutput.push("  Sequential Script Execution");
                        }
                        semanticOutput.push("");

                        semanticOutput.push("ENDPOINT:");
                        if (endpoints.length > 0) {
                            endpoints.forEach(ep => semanticOutput.push(`- ${ep}`));
                        } else {
                            semanticOutput.push("- None");
                        }
                        semanticOutput.push("");

                        semanticOutput.push("MODEL / STATE:");
                        let stateTracker = [];
                        if (rawCode.includes('localStorage')) stateTracker.push('LocalStorage Persistent State');
                        if (rawCode.includes('sessionStorage')) stateTracker.push('SessionStorage State');
                        if (rawCode.includes('.innerHTML') || rawCode.includes('.value')) stateTracker.push('DOM State Mutations');
                        semanticOutput.push(stateTracker.length > 0 ? stateTracker.map(s => `- ${s}`).join('\n') : "- Stateless");

                    } 
                    
                    // --- PARSER ENGINE UNTUK GO (BACKEND ARCHITECTURE MAP) ---
                    else if (file.name.endsWith('.go')) {
                        let structs = [];
                        let publicApis = [];
                        let flowSteps = [];
                        let endpoints = [];

                        let currentStruct = null;
                        let structFields = [];

                        // Pass 1: Kumpulkan semua nama fungsi lokal Go yang didefinisikan di file
                        let localFunctions = new Set();
                        for (let i = 0; i < lines.length; i++) {
                            let line = lines[i].trim();
                            if (line.startsWith('func ')) {
                                let funcSignature = line.split('{')[0].replace('func ', '').trim();
                                let funcNameMatch = funcSignature.match(/([a-zA-Z0-9_]+)\s*\(/);
                                let funcName = funcNameMatch ? funcNameMatch[1] : "";
                                if (funcName) localFunctions.add(funcName);
                            }
                        }

                        // Pass 2: Struct, Endpoints, dan Call Graph (Hanya fungsi lokal)
                        for (let i = 0; i < lines.length; i++) {
                            let line = lines[i].trim();

                            // Struct Models
                            if (line.startsWith('type ') && line.includes('struct {')) {
                                currentStruct = line.split(' ')[1];
                                structFields = [];
                                continue;
                            }
                            if (currentStruct) {
                                if (line === '}') {
                                    structs.push(`${currentStruct} { ${structFields.join(', ')} }`);
                                    currentStruct = null;
                                } else if (line && !line.startsWith('//')) {
                                    let parts = line.split(/\s+/);
                                    if (parts.length >= 1) {
                                        let jsonTagMatch = line.match(/json:"([^"]+)"/);
                                        structFields.push(jsonTagMatch ? jsonTagMatch[1] : parts[0]);
                                    }
                                }
                            }

                            // Router / Endpoints detection
                            if (line.includes('.GET(') || line.includes('.POST(') || line.includes('.PUT(') || line.includes('.DELETE(')) {
                                let epMatch = line.match(/\.(GET|POST|PUT|DELETE)\s*\(\s*["']([^"']+)["']/);
                                if (epMatch) {
                                    endpoints.push(`${epMatch[1]} ${epMatch[2]}`);
                                }
                            }

                            // Functions
                            if (line.startsWith('func ')) {
                                let funcSignature = line.split('{')[0].replace('func ', '').trim();
                                let funcNameMatch = funcSignature.match(/([a-zA-Z0-9_]+)\s*\(/);
                                let funcName = funcNameMatch ? funcNameMatch[1] : "";

                                if (funcName) publicApis.push(funcSignature);

                                // Scope Isolation ({...})
                                let braceCount = 0;
                                let startedBrace = false;
                                let funcEndIdx = lines.length - 1;

                                for (let j = i; j < lines.length; j++) {
                                    let openCount = (lines[j].match(/\{/g) || []).length;
                                    let closeCount = (lines[j].match(/\}/g) || []).length;

                                    if (openCount > 0) startedBrace = true;
                                    braceCount += openCount - closeCount;

                                    if (startedBrace && braceCount <= 0) {
                                        funcEndIdx = j;
                                        break;
                                    }
                                }

                                let bodyText = lines.slice(i, funcEndIdx + 1).join('\n');
                                let calls = [];
                                let callMatches = bodyText.matchAll(/([a-zA-Z0-9_]+)\s*\(/g);
                                for (let cm of callMatches) {
                                    let fn = cm[1];
                                    if (fn !== funcName && localFunctions.has(fn)) {
                                        if (!calls.includes(fn)) calls.push(fn);
                                    }
                                }
                                if (calls.length > 0) {
                                    flowSteps.push(`${funcName}() -> ${calls.join(' -> ')}`);
                                }
                            }
                        }

                        semanticOutput.push("PUBLIC API / EXPORT:");
                        if (publicApis.length > 0) {
                            publicApis.forEach(fn => semanticOutput.push(`- ${fn}`));
                        } else {
                            semanticOutput.push("- None");
                        }
                        semanticOutput.push("");

                        semanticOutput.push("FLOW / CALL GRAPH:");
                        if (flowSteps.length > 0) {
                            flowSteps.forEach(s => semanticOutput.push(`  ${s}`));
                        } else {
                            semanticOutput.push("  Internal Data Handler / Package Executable");
                        }
                        semanticOutput.push("");

                        semanticOutput.push("ENDPOINT:");
                        if (endpoints.length > 0) {
                            endpoints.forEach(ep => semanticOutput.push(`- ${ep}`));
                        } else {
                            semanticOutput.push("- None Route Mapped Directly");
                        }
                        semanticOutput.push("");

                        semanticOutput.push("MODEL / STRUCT:");
                        if (structs.length > 0) {
                            structs.forEach(st => semanticOutput.push(`- ${st}`));
                        } else {
                            semanticOutput.push("- None");
                        }

                    } else {
                        semanticOutput.push("PUBLIC API / EXPORT:\n- Static Asset / Config Data\n");
                        semanticOutput.push("FLOW / CALL GRAPH:\n  Static Asset Loading\n");
                        semanticOutput.push("ENDPOINT:\n- None\n");
                        semanticOutput.push("MODEL / STRUCT:\n- None");
                    }

                    semanticOutput.push("==================================================");
                    finalOutputArray.push(semanticOutput.join('\n'));

                    processedCount++;
                    if (processedCount === selectedFileKeys.length) {
                        document.getElementById('outputArea').value = finalOutputArray.join('\n\n');
                    }
                };
                reader.readAsText(file);
            });
        }


        function extractExactFull() {
            if (selectedFileKeys.length === 0) return;

            let finalOutputArray = [];
            let processedCount = 0;

            selectedFileKeys.forEach(fileKey => {
                const file = projectFiles[fileKey];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const rawCode = e.target.result;
                    let fileResult = `// Target File: /${fileKey}\n// =========================================\n${rawCode}`;
                    finalOutputArray.push(fileResult);

                    processedCount++;
                    if (processedCount === selectedFileKeys.length) {
                        document.getElementById('outputArea').value = finalOutputArray.join('\n\n\n');
                    }
                };
                reader.readAsText(file);
            });
        }


        function copyToClipboard() {
            const copyText = document.getElementById("outputArea");
            if (!copyText.value) return;


            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);


            const btn = document.getElementById('btnCopy');
            const originalText = btn.innerText;
            btn.innerText = '✅ COPIED!';
            btn.style.background = '#22c55e';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = '#4f46e5';
            }, 1500);
        }

        function downloadAsTxt() {
            const outputText = document.getElementById("outputArea").value;
            if (!outputText) {
                alert("Tidak ada output untuk di-download. Silakan jalankan extract terlebih dahulu.");
                return;
            }

            const blob = new Blob([outputText], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "viber_engine_output.txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
