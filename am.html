<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses AM Digital</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.08);
            overflow: hidden;
            border: 1px solid #e1e9f5;
        }
        .header {
            background-color: #0066cc;
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
        }
        .header h2 {
            font-size: 20px;
            font-weight: 600;
        }
        .content {
            padding: 24px 20px;
        }
        .info-group {
            margin-bottom: 16px;
            background-color: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #0066cc;
        }
        .label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .value {
            font-size: 16px;
            color: #1e293b;
            font-weight: 600;
            word-break: break-all;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #0066cc;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 24px;
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #004e9e;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>AM Digital</h2>
        </div>
        <div class="content">
            <div class="info-group">
                <div class="label">User</div>
                <div class="value">superadmin</div>
            </div>
            
            <div class="info-group">
                <div class="label">Pass</div>
                <div class="value">Admin@123</div>
            </div>

            <a href="http://10.167.170.56/form-am-v2" class="btn" target="_blank">Buka Form AM Digital</a>
        </div>
    </div>

</body>
</html>
