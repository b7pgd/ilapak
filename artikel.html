<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencari Referensi Akademik — Jurnal, Buku, Prosiding, Tesis</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background:#f0f2f5; color:#1a1a1a;
         display:flex; flex-direction:column; align-items:center; padding:24px 12px 48px; }
  .wrap { width:100%; max-width:860px; }
  h1 { font-size:23px; text-align:center; margin-bottom:4px; }
  p.sub { font-size:14px; color:#666; text-align:center; margin-bottom:18px; }
  .card { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.10); padding:18px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  #q { flex:1 1 320px; padding:12px 14px; font-size:16px; border:2px solid #c9ced6; border-radius:8px; }

  .filters { margin-top:14px; display:flex; gap:14px 22px; flex-wrap:wrap; font-size:14px; }
  .filters label { display:flex; flex-direction:column; gap:5px; font-weight:bold; color:#444; }
  .filters select, .filters input[type=number] { padding:8px; font-size:14px; border:1.5px solid #c9ced6;
             border-radius:6px; font-weight:normal; background:#fff; }

  .srcs { flex-direction:row !important; align-items:center; gap:8px !important; }
  .srcs span { display:flex; align-items:center; gap:5px; font-weight:normal; color:#1a1a1a; }
  .combine-box { margin-top:16px; background:#FFF8E1; border:1.5px solid #FFE082; border-radius:10px; padding:13px 14px; }
  .combine-toggle { display:flex; align-items:flex-start; gap:8px; font-size:14.5px; cursor:pointer; line-height:1.45; }
  .combine-toggle input { margin-top:3px; width:17px; height:17px; }
  #question { width:100%; margin-top:10px; padding:11px 13px; font-size:15px; border:2px solid #c9ced6;

  #actions { margin-top:6px; display:none; gap:10px; flex-wrap:wrap; }

  #note { margin-top:8px; font-size:12.5px; color:#888; display:none; }

  .view { background:#fff; border:2px solid #c9ced6; border-radius:0 0 12px 12px; padding:16px;

  #results, #finderResults { display:flex; flex-direction:column; gap:12px; }

  .badges { margin:7px 0 5px; display:flex; gap:6px; flex-wrap:wrap; }
  .badge { font-size:11.5px; font-weight:bold; padding:3px 9px; border-radius:20px; background:#ECEFF1; color:#37474F; }
  .badge.jurnal { background:#E8EAF6; color:#283593; }
  .badge.buku { background:#FFF3E0; color:#E65100; }

  .badge.tesis { background:#FCE4EC; color:#AD1457; }
  .badge.pdf { background:#E8F5E9; color:#2E7D32; }
  .badge.rel { background:#FFF3E0; color:#E65100; }
  .badge.src { background:#fff; border:1.5px solid #cfd8dc; color:#607D8B; }
  .meta { font-size:13.5px; color:#555; line-height:1.5; }
  .abs { font-size:13.5px; color:#444; line-height:1.55; margin-top:6px; }
  .doi { font-size:13px; margin-top:6px; word-break:break-all; }
  .doi a { color:#1565C0; }
  .excerpt { margin-top:9px; background:#FAFAFA; border-left:4px solid #F9A825; border-radius:0 8px 8px 0;
             padding:11px 13px; font-size:14.5px; line-height:1.65; color:#263238; }
  .excerpt .pg { display:block; font-size:12.5px; font-weight:bold; color:#EF6C00; margin-bottom:5px; }

          border-radius:8px; padding:10px 12px; }
  .cite b { color:#1565C0; }
  .item .row2 { margin-top:9px; display:flex; gap:8px; flex-wrap:wrap; }
  .item .row2 button, .item .row2 a { font-size:13px; font-weight:bold; padding:7px 13px; border-radius:6px;
             cursor:pointer; text-decoration:none; }
  .btn-cite { background:#1565C0; color:#fff; border:none; }
  .btn-cite:hover { background:#0D47A1; }
  .btn-open { background:#fff; color:#1565C0; border:1.5px solid #1565C0 !important; }
  .btn-pdf { background:#2E7D32; color:#fff; border:none; }
  .copied { background:#2E7D32 !important; }
  .empty { font-size:14px; color:#888; text-align:center; padding:22px 10px; line-height:1.6; }
  footer { margin-top:22px; font-size:12.5px; color:#999; text-align:center; line-height:1.6; }
</style>
<style>
  /* ===== Tema putih-biru + pagination nomor + modal + anti melebar ===== */

  #btnCari { background: linear-gradient(135deg, #1565C0, #1E88E5); border-radius: 10px;

  #btnCari:disabled { background: #90a4ae; box-shadow: none; }

  #pageNums { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #pager .pnum { min-width: 38px; padding: 8px 10px; font-size: 14px; font-weight: bold; border-radius: 7px;

  .modal-header { padding: 15px 20px; border-bottom: 1px solid #e0e0e0; display: flex;

  .meta-table th { width: 30%; color: #546E7A; font-weight: bold; background: #FAFCFE; }
  .meta-table td { width: 70%; color: #1a1a1a; word-break: break-word; }
  .bib-box { margin-top: 14px; background: #F5F7FA; border: 1.5px solid #d6e4f0; border-radius: 8px;

  .bib-box b { color: #1565C0; display: block; margin-bottom: 4px; }
  .modal-footer { padding: 13px 20px; border-top: 1px solid #e0e0e0; background: #f8f9fa;
                  display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .modal-footer button { padding: 9px 16px; font-size: 14px; font-weight: bold; border-radius: 7px;
                          cursor: pointer; border: none; }
  .btn-copy-bib { background: #1565C0; color: #fff; }
  .btn-copy-bib:hover { background: #0D47A1; }
  .btn-close-modal { background: #ECEFF1; color: #37474F; }
  .btn-close-modal:hover { background: #CFD8DC; }
  /* anti melebar: layout dikunci selebar layar */

  .wrap, .card, .item { min-width: 0; }

  .meta-table td, .bib-box { overflow-wrap: anywhere; }
  .modal-body { overflow-x: hidden; }
  .modal-content { min-width: 0; }
  input, select { max-width: 100%; }
  @media (max-width: 600px) {
    body { padding: 14px 8px 32px; }
    .hero { padding: 20px 12px; border-radius: 12px; }
    .hero h1 { font-size: 20px; }
    .card { padding: 14px; }
    .item { padding: 12px 13px; }
    #q { flex: 1 1 100%; }
    #btnCari { width: 100%; }
    .modal-body { padding: 14px; }
    .meta-table th { width: 34%; }
    .modal-footer button { flex: 1; }
  }
</style>

<body>
<div class="wrap">
  <div class="hero">
    <h1>🎓 Pencari Referensi Akademik</h1>
  </div>

  <div class="card">
    <div class="row">
      <input id="q" type="text" placeholder="Kata kunci, contoh: tata kelola TI" autocomplete="off">
      <button id="btnCari">🔍 Cari</button>
    </div>
    
    <div class="filters">
      <label>Jenis
        <select id="fType">
          <option value="all">Semua jenis</option>
          <option value="jurnal">Artikel Jurnal</option>
          <option value="buku">Buku / Bab Buku</option>
          <option value="prosiding">Prosiding</option>
          <option value="tesis">Tesis / Disertasi</option>
        </select>
      </label>
      <label>Bahasa
        <select id="fLang">
          <option value="all">Semua bahasa</option>
          <option value="id">Indonesia</option>
          <option value="en">Inggris</option>
        </select>
      </label>
      <label>Tahun dari
        <input id="fFrom" type="number" min="1900" max="2100" placeholder="2018">
      </label>
      <label>Tahun sampai
        <input id="fTo" type="number" min="1900" max="2100" placeholder="2026">
      </label>
      <label>Urutkan
        <select id="fSort">
          <option value="relevance">Paling relevan</option>
          <option value="newest">Terbaru</option>
          <option value="cited">Paling banyak disitasi</option>
        </select>
      </label>
      <label class="srcs">Sumber
        <span><input type="checkbox" id="srcOA" checked> OpenAlex</span>
        <span><input type="checkbox" id="srcCR" checked> Crossref</span>
      </label>
    </div>
    <div id="status">Masukkan kata kunci lalu tekan Cari. Tips: pakai kata kunci inti, bukan kalimat pertanyaan utuh.</div>
    <div id="actions">
      <button id="btnCopyLinks">📋 Salin Semua Link (halaman ini)</button>
      <button id="btnCopyCites">📚 Salin Semua Sitasi Halaman Ini (APA)</button>
    </div>
    <div id="note">Catatan: filter bahasa berlaku penuh di OpenAlex; Crossref tidak menyediakan filter bahasa, jadi sebagian hasil Crossref bisa berbahasa lain.</div>
    <div id="pager">
      <button id="btnPrev">← Sebelumnya</button>
      <span id="pageNums"></span>
      <button id="btnNext">Berikutnya →</button>
    </div>
  </div>

  

  <div id="viewBiasa" class="view plain">
    <div id="results"></div>
  </div>

  

  
</div>

<script>
/*__PURE_START__*/
// ---------- Pemetaan jenis ----------
const TYPE_FILTER = {
  all:      { oa: null,                        cr: null },
  jurnal:   { oa: "article",                   cr: "journal-article" },
  buku:     { oa: "book|book-chapter",         cr: "book" },
  prosiding:{ oa: "proceedings-article",       cr: "proceedings-article" },
  tesis:    { oa: "dissertation",              cr: "dissertation" }
};
const TYPE_LABEL_OA = { "article":"Jurnal", "book":"Buku", "book-chapter":"Bab Buku",
  "proceedings-article":"Prosiding", "dissertation":"Tesis/Disertasi", "report":"Laporan", "other":"Lainnya" };
const TYPE_LABEL_CR = { "journal-article":"Jurnal", "book":"Buku", "monograph":"Buku", "edited-book":"Buku",
  "book-chapter":"Bab Buku", "book-section":"Bab Buku", "proceedings-article":"Prosiding",
  "proceedings":"Prosiding", "dissertation":"Tesis/Disertasi", "posted-content":"Preprint", "report":"Laporan" };
const BOOK_TYPES = ["Buku", "Bab Buku"];

function normTitleKey(t) {
  return "t:" + (t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
function dedupeKey(r) {
  return r.doi ? "doi:" + r.doi.toLowerCase() : normTitleKey(r.title);
}
function reconstructAbstract(inv) {
  if (!inv) return "";
  const words = [];
  for (const w in inv) for (const pos of inv[w]) words[pos] = w;
  return words.join(" ");
}
function nameToApa(name) {
  const parts = (name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "";
  if (parts.length === 1) return parts[0];
  const last = parts[parts.length - 1];
  const initials = parts.slice(0, -1).map(p => p[0].toUpperCase() + ".").join(" ");
  return last + ", " + initials;
}
function crAuthorToApa(a) {
  if (a.family) {
    const ini = (a.given || "").trim().split(/\s+/).filter(Boolean).map(p => p[0].toUpperCase() + ".").join(" ");
    return ini ? a.family + ", " + ini : a.family;
  }
  return nameToApa(a.name || "");
}
function joinApaAuthors(list) {
  if (!list.length) return "";
  if (list.length === 1) return list[0];
  if (list.length === 2) return list[0] + ", & " + list[1];
  return list.slice(0, -1).join(", ") + ", & " + list[list.length - 1];
}
function fmtPages(p) {
  return p ? String(p).replace(/(\d)\s*-\s*(\d)/, "$1–$2") : "";
}
function apaCitation(r) {
  const auth = r.authorsApa && r.authorsApa.length ? joinApaAuthors(r.authorsApa) : (r.authors[0] || "Anonim");
  let s = auth + " (" + (r.year || "n.d.") + "). " + (r.title || "").replace(/\.+$/, "") + ".";
  const isBook = BOOK_TYPES.includes(r.typeLabel);
  if (isBook) {
    if (r.typeLabel === "Bab Buku" && r.venue) {
      s += " Dalam " + r.venue;
      if (r.pages) s += " (hlm. " + fmtPages(r.pages) + ")";
      s += ".";
    }
    if (r.publisher) s += " " + r.publisher + ".";
    else if (r.typeLabel === "Buku" && r.venue) s += " " + r.venue + ".";
  } else {
    if (r.venue) {
      s += " " + r.venue;
      if (r.volume) {
        s += ", " + r.volume;
        if (r.issue) s += "(" + r.issue + ")";
      }
      if (r.pages) s += ", " + fmtPages(r.pages);
      s += ".";
    } else if (r.publisher) {
      s += " " + r.publisher + ".";
    }
  }
  if (r.doi) s += " https://doi.org/" + r.doi;
  else if (r.url) s += " " + r.url;
  return s;
}
function normalizeOA(w) {
  const loc = w.primary_location || {};
  const src = loc.source || {};
  const bib = w.biblio || {};
  const pages = bib.first_page ? (bib.last_page && bib.last_page !== bib.first_page
    ? bib.first_page + "-" + bib.last_page : bib.first_page) : "";
  const doi = w.doi ? w.doi.replace(/^https?:\/\/doi\.org\//, "") : "";
  let pdf = (w.open_access && w.open_access.oa_url) || loc.pdf_url || "";
  if (!pdf && Array.isArray(w.locations)) {
    const l = w.locations.find(x => x.pdf_url);
    if (l) pdf = l.pdf_url;
  }
  const authors = (w.authorships || []).map(a => (a.author || {}).display_name).filter(Boolean);
  return {
    source: "OpenAlex",
    title: w.display_name || "",
    authors: authors,
    authorsApa: authors.map(nameToApa),
    year: w.publication_year || null,
    venue: src.display_name || "",
    publisher: "",
    volume: bib.volume || "", issue: bib.issue || "", pages: pages,
    doi: doi,
    url: doi ? "https://doi.org/" + doi : (loc.landing_page_url || w.id || ""),
    pdf: pdf,
    cited: w.cited_by_count || 0,
    abstract: reconstructAbstract(w.abstract_inverted_index),
    typeLabel: TYPE_LABEL_OA[w.type] || "Lainnya"
  };
}
function normalizeCR(w) {
  const dp = (w.published && w.published["date-parts"]) || (w.issued && w.issued["date-parts"]) ||
             (w.created && w.created["date-parts"]) || [[null]];
  const authors = (w.author || []).map(a => a.name || [a.given, a.family].filter(Boolean).join(" ")).filter(Boolean);
  let pdf = "";
  if (Array.isArray(w.link)) {
    const l = w.link.find(x => x["content-type"] === "application/pdf");
    if (l) pdf = l.URL;
  }
  return {
    source: "Crossref",
    title: (w.title && w.title[0]) || "",
    authors: authors,
    authorsApa: (w.author || []).map(crAuthorToApa).filter(Boolean),
    year: (dp[0] && dp[0][0]) || null,
    venue: (w["container-title"] && w["container-title"][0]) || "",
    publisher: w.publisher || "",
    volume: w.volume || "", issue: w.issue || "", pages: w.page || "",
    doi: w.DOI || "",
    url: w.DOI ? "https://doi.org/" + w.DOI : (w.URL || ""),
    pdf: pdf,
    cited: w["is-referenced-by-count"] || 0,
    abstract: (w.abstract || "").replace(/<[^>]+>/g, ""),
    typeLabel: TYPE_LABEL_CR[w.type] || "Lainnya"
  };
}
function mergeResults(oaList, crList) {
  const map = new Map();
  const order = [];
  function add(r) {
    if (!r.title) return;
    const k = dedupeKey(r);
    if (!map.has(k)) { map.set(k, r); order.push(k); return; }
    const ex = map.get(k);
    for (const f of ["venue", "publisher", "volume", "issue", "pages", "pdf", "abstract", "doi", "url"]) {
      if (!ex[f] && r[f]) ex[f] = r[f];
    }
    if (!ex.year && r.year) ex.year = r.year;
    if ((r.cited || 0) > (ex.cited || 0)) ex.cited = r.cited;
    if (!ex.authorsApa.length && r.authorsApa.length) { ex.authorsApa = r.authorsApa; ex.authors = r.authors; }
    if (!ex.source.includes(r.source)) ex.source += "+" + r.source;
  }
  oaList.forEach(add);
  crList.forEach(add);
  return order.map(k => map.get(k));
}

/*__PURE_END__*/

// ---------- UI & pencarian ----------
const $ = id => document.getElementById(id);
const MAX_PAGES = 6, PER_PAGE = 25;
let lastQuery = null;            // {q, o, useOA, useCR}
let pageCache = new Map();       // page -> {items, total}
let currentPage = 1, maxPage = 1, currentItems = [];
let searchGen = 0;               // nomor generasi pencarian (membatalkan job lama)


function buildOAUrl(q, o, page) {
  const p = new URLSearchParams({ search: q, "per-page": PER_PAGE, page: page });
  const f = [];
  const tf = TYPE_FILTER[o.type].oa;
  if (tf) f.push("type:" + tf);
  if (o.lang !== "all") f.push("language:" + o.lang);
  if (o.from && o.to) f.push("publication_year:" + o.from + "-" + o.to);
  else if (o.from) f.push("from_publication_date:" + o.from + "-01-01");
  else if (o.to) f.push("to_publication_date:" + o.to + "-12-31");
  if (f.length) p.set("filter", f.join(","));
  if (o.sort === "newest") p.set("sort", "publication_date:desc");
  else if (o.sort === "cited") p.set("sort", "cited_by_count:desc");
  return "https://api.openalex.org/works?" + p.toString();
}
function buildCRUrl(q, o, page) {
  const p = new URLSearchParams({ query: q, rows: PER_PAGE, offset: (page - 1) * PER_PAGE });
  const f = [];
  const tf = TYPE_FILTER[o.type].cr;
  if (tf) f.push("type:" + tf);
  if (o.from) f.push("from-pub-date:" + o.from + "-01-01");
  if (o.to) f.push("until-pub-date:" + o.to + "-12-31");
  if (f.length) p.set("filter", f.join(","));
  if (o.sort === "newest") { p.set("sort", "published"); p.set("order", "desc"); }
  else if (o.sort === "cited") { p.set("sort", "is-referenced-by-count"); p.set("order", "desc"); }
  return "https://api.crossref.org/works?" + p.toString();
}
async function searchPage(page) {
  if (pageCache.has(page)) return pageCache.get(page);
  const { q, o, useOA, useCR } = lastQuery;
  const jobs = [];
  if (useOA) jobs.push(fetch(buildOAUrl(q, o, page))
    .then(r => { if (!r.ok) throw new Error("OpenAlex " + r.status); return r.json(); })
    .then(d => ({ src: "oa", total: (d.meta || {}).count || 0, items: (d.results || []).map(normalizeOA) })));
  if (useCR) jobs.push(fetch(buildCRUrl(q, o, page))
    .then(r => { if (!r.ok) throw new Error("Crossref " + r.status); return r.json(); })
    .then(d => ({ src: "cr", total: (d.message || {})["total-results"] || 0, items: ((d.message || {}).items || []).map(normalizeCR) })));
  const settled = await Promise.allSettled(jobs);
  let oaList = [], crList = [], total = 0, errs = [];
  for (const s of settled) {
    if (s.status === "fulfilled") {
      if (s.value.src === "oa") oaList = s.value.items; else crList = s.value.items;
      total = Math.max(total, s.value.total);
    } else errs.push(s.reason.message);
  }
  let items = mergeResults(oaList, crList);
  if (o.sort === "newest") items.sort((a, b) => (b.year || 0) - (a.year || 0));
  else if (o.sort === "cited") items.sort((a, b) => (b.cited || 0) - (a.cited || 0));
  const res = { items: items, total: total, errs: errs };
  pageCache.set(page, res);
  return res;
}

async function cari() {
  const q = $("q").value.trim();
  if (!q) { $("status").textContent = "⚠️ Isi dulu kata kuncinya."; $("q").focus(); return; }
  const useOA = $("srcOA").checked, useCR = $("srcCR").checked;
  if (!useOA && !useCR) { $("status").textContent = "⚠️ Pilih minimal satu sumber."; return; }
  const o = { type: $("fType").value, lang: $("fLang").value, sort: $("fSort").value,
              from: $("fFrom").value, to: $("fTo").value };
  lastQuery = { q: q, o: o, useOA: useOA, useCR: useCR };
  pageCache = new Map();
  currentPage = 1;
  searchGen++;
  await goToPage(1);
}

async function goToPage(page) {
  const gen = searchGen;
  const btn = $("btnCari");
  btn.disabled = true; btn.textContent = "⏳ Mencari...";
  $("status").textContent = "Mengambil halaman " + page + "...";
  let res;
  try { res = await searchPage(page); }
  catch (e) { res = { items: [], total: 0, errs: [String(e)] }; }
  if (gen !== searchGen) return;
  btn.disabled = false; btn.textContent = "🔍 Cari";
  currentPage = page;
  currentItems = res.items;
  maxPage = Math.max(1, Math.min(MAX_PAGES, Math.ceil((res.total || res.items.length) / PER_PAGE)));
  if (!res.items.length) {
    $("status").textContent = res.errs.length
      ? "❌ Gagal mengambil data (" + res.errs.join(", ") + "). Cek koneksi internet lalu coba lagi."
      : "Tidak ada hasil di halaman " + page + ". Coba kata kunci yang lebih umum atau longgarkan filter.";
    $("results").innerHTML = "";
    $("actions").style.display = "none";
    $("pager").style.display = "none";
    return;
  }
  $("status").textContent = "✅ " + res.items.length + " referensi di halaman " + page +
    " (total ±" + res.total.toLocaleString("id-ID") + " hasil" +
    (res.errs.length ? "; sebagian sumber gagal: " + res.errs.join(", ") : "") + ").";
  $("note").style.display = lastQuery.o.lang !== "all" && lastQuery.useCR ? "block" : "none";
  $("actions").style.display = "flex";
  $("pager").style.display = "flex";
  renderPageNums();
  $("btnPrev").disabled = page <= 1;
  $("btnNext").disabled = page >= maxPage;
  render(res.items, (page - 1) * PER_PAGE);
}

function renderPageNums() {
  const box = $("pageNums");
  box.innerHTML = "";
  for (let i = 1; i <= maxPage; i++) {
    const b = document.createElement("button");
    b.className = "pnum" + (i === currentPage ? " active" : "");
    b.textContent = i;
    b.disabled = i === currentPage;
    b.onclick = () => goToPage(i);
    box.appendChild(b);
  }
}

function badgeClass(label) {
  if (label === "Jurnal") return "badge jurnal";
  if (BOOK_TYPES.includes(label)) return "badge buku";
  if (label === "Prosiding") return "badge prosiding";
  if (label === "Tesis/Disertasi") return "badge tesis";
  return "badge";
}
function badgesFor(r, extraRel) {
  const badges = document.createElement("div");
  badges.className = "badges";
  const b1 = document.createElement("span");
  b1.className = badgeClass(r.typeLabel); b1.textContent = r.typeLabel;
  badges.appendChild(b1);
  if (extraRel != null) {
    const br = document.createElement("span");
    br.className = "badge rel"; br.textContent = "🎯 Relevansi " + extraRel + "%";
    badges.appendChild(br);
  }
  if (r.pdf) {
    const bp = document.createElement("span");
    bp.className = "badge pdf"; bp.textContent = "📄 PDF tersedia";
    badges.appendChild(bp);
  }
  if (r.cited) {
    const bc = document.createElement("span");
    bc.className = "badge"; bc.textContent = "Disitasi " + r.cited + "×";
    badges.appendChild(bc);
  }
  const bs = document.createElement("span");
  bs.className = "badge src"; bs.textContent = r.source;
  badges.appendChild(bs);
  return badges;
}
function actionRow(r) {
  const row2 = document.createElement("div");
  row2.className = "row2";

  const bMeta = document.createElement("button");
  bMeta.className = "btn-meta"; bMeta.textContent = "📖 Metadata Bibliografi";
  bMeta.onclick = () => openMetadataModal(r);
  row2.appendChild(bMeta);
  const bc = document.createElement("button");
  bc.className = "btn-cite"; bc.textContent = "📚 Salin Sitasi APA";
  bc.onclick = () => copyText(apaCitation(r), bc);
  row2.appendChild(bc);
  if (r.pdf) {
    const ap = document.createElement("a");
    ap.className = "btn-pdf"; ap.href = r.pdf; ap.target = "_blank"; ap.rel = "noopener";
    ap.textContent = "⬇ Buka PDF";
    row2.appendChild(ap);
  }
  const ao = document.createElement("a");
  ao.className = "btn-open"; ao.href = r.url; ao.target = "_blank"; ao.rel = "noopener";
  ao.textContent = "🔗 Buka Sumber";
  row2.appendChild(ao);
  return row2;
}
function cardHead(r, num) {
  const head = document.createElement("div");
  const n = document.createElement("span");
  n.className = "num"; n.textContent = num + ". ";
  const a = document.createElement("a");
  a.className = "title"; a.href = r.url; a.target = "_blank"; a.rel = "noopener";
  a.textContent = r.title;
  head.appendChild(n); head.appendChild(a);
  return head;
}
function metaLine(r) {
  const meta = document.createElement("div");
  meta.className = "meta";
  const au = r.authors.length > 3 ? r.authors.slice(0, 3).join(", ") + ", dkk." : r.authors.join(", ");
  meta.textContent = [au, r.year, r.venue || r.publisher].filter(Boolean).join(" • ") ||
    "Metadata terbatas — buka link untuk detail.";
  return meta;
}
function render(list, offset) {
  const box = $("results");
  box.innerHTML = "";
  list.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.appendChild(cardHead(r, offset + i + 1));
    div.appendChild(badgesFor(r, null));
    div.appendChild(metaLine(r));
    if (r.abstract) {
      const ab = document.createElement("div");
      ab.className = "abs";
      ab.textContent = r.abstract.length > 240 ? r.abstract.slice(0, 240).trim() + "…" : r.abstract;
      div.appendChild(ab);
    }
    if (r.doi) {
      const dl = document.createElement("div");
      dl.className = "doi";
      dl.appendChild(document.createTextNode("DOI: "));
      const da = document.createElement("a");
      da.href = "https://doi.org/" + r.doi; da.target = "_blank"; da.rel = "noopener";
      da.textContent = r.doi;
      dl.appendChild(da);
      div.appendChild(dl);
    }
    div.appendChild(actionRow(r));
    box.appendChild(div);
  });
}

// ---------- Metadata Bibliografi ----------
function formatVal(val) {
  if (val === null || val === undefined || val === "" || (Array.isArray(val) && val.length === 0)) return null;
  return Array.isArray(val) ? val.join(", ") : String(val);
}
function openMetadataModal(r) {
  const existing = document.querySelector(".modal-overlay");
  if (existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const content = document.createElement("div");
  content.className = "modal-content";
  const header = document.createElement("div");
  header.className = "modal-header";
  const h3 = document.createElement("h3");
  h3.textContent = "Metadata Bibliografi";
  const closeBtn = document.createElement("button");
  closeBtn.className = "modal-close";
  closeBtn.innerHTML = "&times;";
  closeBtn.onclick = () => overlay.remove();
  header.appendChild(h3);
  header.appendChild(closeBtn);
  content.appendChild(header);
  const body = document.createElement("div");
  body.className = "modal-body";
  const table = document.createElement("table");
  table.className = "meta-table";
  const fields = [
    { label: "Penulis", val: r.authors && r.authors.length ? r.authors : null },
    { label: "Tahun terbit", val: r.year },
    { label: "Judul artikel", val: r.title },
    { label: "Nama jurnal", val: r.venue },
    { label: "Volume", val: r.volume },
    { label: "Nomor", val: r.issue },
    { label: "Halaman", val: r.pages },
    { label: "Penerbit", val: r.publisher },
    { label: "DOI", val: r.doi }
  ];
  fields.forEach(f => {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = f.label;
    const td = document.createElement("td");
    const fv = formatVal(f.val);
    if (fv === null) td.innerHTML = "<span style='color:#999; font-style:italic;'>Tidak tersedia</span>";
    else td.textContent = fv;
    tr.appendChild(th);
    tr.appendChild(td);
    table.appendChild(tr);
  });
  body.appendChild(table);
  const bibBox = document.createElement("div");
  bibBox.className = "bib-box";
  const bb = document.createElement("b");
  bb.textContent = "Format Daftar Pustaka (APA 7):";
  bibBox.appendChild(bb);
  const bibSpan = document.createElement("span");
  bibSpan.textContent = apaCitation(r);
  bibBox.appendChild(bibSpan);
  body.appendChild(bibBox);
  content.appendChild(body);
  const footer = document.createElement("div");
  footer.className = "modal-footer";
  const btnCopy = document.createElement("button");
  btnCopy.className = "btn-copy-bib";
  btnCopy.textContent = "📋 Salin Daftar Pustaka";
  btnCopy.onclick = e => copyText(apaCitation(r), e.currentTarget);
  footer.appendChild(btnCopy);
  const btnClose = document.createElement("button");
  btnClose.className = "btn-close-modal";
  btnClose.textContent = "Tutup";
  btnClose.onclick = () => overlay.remove();
  footer.appendChild(btnClose);
  content.appendChild(footer);
  overlay.appendChild(content);
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

// ---------- Salin ----------
async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = "✅ Tersalin!"; btn.classList.add("copied");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1500);
  }
}
$("btnCari").onclick = cari;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") cari(); });
$("btnPrev").onclick = () => { if (currentPage > 1) goToPage(currentPage - 1); };
$("btnNext").onclick = () => { if (currentPage < maxPage) goToPage(currentPage + 1); };
$("btnCopyLinks").onclick = e => copyText(
  currentItems.map((r, i) => ((currentPage - 1) * PER_PAGE + i + 1) + ". " + r.url).join("\n"), e.currentTarget);
$("btnCopyCites").onclick = e => copyText(
  [...currentItems].sort((a, b) => apaCitation(a).localeCompare(apaCitation(b)))
    .map(apaCitation).join("\n\n"), e.currentTarget);
</script>
